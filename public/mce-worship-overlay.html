<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>MCE Worship Overlay</title>
  <link href="/fonts/google/google-fonts.css" rel="stylesheet">
  <link href="/fonts/cmg-sans-fonts.css" rel="stylesheet">
  <script>
    (function () {
      document.addEventListener("keydown", function (e) { var c = e.ctrlKey || e.metaKey; if (!c) return; var k = e.key; if (k === "=" || k === "-" || k === "0" || k === "Plus" || k === "Minus" || k === "NumpadAdd" || k === "NumpadSubtract" || k === "Numpad0") { e.preventDefault(); e.stopPropagation(); } }, true);
      document.addEventListener("wheel", function (e) { if (e.ctrlKey || e.metaKey) e.preventDefault(); }, { passive: false, capture: true });
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener("gesturechange", function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener("gestureend", function (e) { e.preventDefault(); }, { passive: false });
    })();
  </script>
  <style>
    html,
    body,
    #overlay-root,
    #overlay-bg-buffer {
      touch-action: pan-y;
      -ms-content-zooming: none;
    }
  </style>
  <script>
    (function () {
      var W = 1920, H = 1080;
      var stage = document.getElementById('overlay-stage');
      if (!stage) return;
      stage.style.width = W + 'px';
      stage.style.height = H + 'px';
      stage.style.transformOrigin = '0 0';
      stage.style.position = 'absolute';
      stage.style.top = '0';
      stage.style.left = '0';
      function fit() {
        var s = Math.min(window.innerWidth / W, window.innerHeight / H);
        stage.style.transform = 'scale(' + s + ')';
      }
      fit();
      window.addEventListener('resize', fit);
    })();
  </script>
  <style>
    /* ── Shared: Font-face ── */
    @font-face {
      font-family: 'Charis SIL';
      src: url('/fonts/charis-sil/CharisSIL-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }

    @font-face {
      font-family: 'Charis SIL';
      src: url('/fonts/charis-sil/CharisSIL-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }

    /* ── Shared: Reset ── */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: 'Charis SIL', 'Noto Sans', 'CMG Sans', Arial, sans-serif;
      background: transparent !important;
      color: #ffffff;
    }

    :root {
      --font-size: 48px;
      --font-family: 'Charis SIL', 'Noto Sans', 'CMG Sans', Arial, sans-serif;
      --font-color: #ffffff;
      --font-weight: 400;
      --font-style: normal;
      --line-height: 1.6;
      --letter-spacing: 0px;
      --text-align: center;
      --text-shadow: none;
      --outline-width: 0px;
      --outline-color: transparent;
      --ref-font-size: 24px;
      --ref-font-family: var(--font-family);
      --ref-font-weight: 400;
      --ref-font-style: normal;
      --ref-font-color: #ffffff;
      --ref-text-transform: none;
      --ref-letter-spacing: 0px;
      --ref-opacity: 1;
      --ref-spacing: 24px;
      --ref-text-align: center;
      --ref-width: 100%;
      --ref-bg-color: transparent;
      --ref-bg-padding: 0;
      --ref-bg-radius: 0;
      --ref-bg-border: none;
      --bg-color: transparent;
      --bg-image: none;
      --bg-opacity: 1;
      --bg-shade-gradient: linear-gradient(180deg, rgba(0, 0, 0, 0.42), rgba(0, 0, 0, 0.42));
      --bg-shade-display: block;
      --padding: 60px;
      --safe-area: 40px;
      --anim-duration: 152ms;
      --bg-enter-duration: 64ms;
      --text-enter-duration: 82ms;
      --text-enter-delay: 12ms;
      --text-transform: none;
      --logo-size: 80px;
      --compare-left-width: 40fr;
      --compare-right-width: 40fr;
      --compare-gap: 40px;
      --compare-outer-padding-top: var(--padding);
      --compare-outer-padding-right: var(--padding);
      --compare-outer-padding-bottom: var(--padding);
      --compare-outer-padding-left: var(--padding);
      --compare-panel-inner-padding: 38px;
      --compare-reference-verse-spacing: 10px;
      --compare-reference-align: var(--ref-text-align, center);
      --compare-reference-transform: var(--ref-text-transform, none);
    }

    html {
      background: transparent !important;
    }

    /* ── Shared: Background layers ── */
    #background {
      position: absolute;
      inset: 0;
      background-color: var(--bg-color);
      background-image: var(--bg-image);
      background-size: cover;
      background-position: center;
      opacity: var(--bg-opacity);
      z-index: 0;
    }

    #bg-crossfade {
      position: absolute;
      inset: 0;
      opacity: 0;
      z-index: 1;
      pointer-events: none;
    }

    #background-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      z-index: 0;
    }

    /* ── Shared: Logo ── */
    #logo {
      position: absolute;
      width: var(--logo-size);
      height: var(--logo-size);
      object-fit: contain;
      z-index: 10;
      display: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #logo.visible {
      display: block;
      opacity: 1;
    }

    #logo.bottom-right {
      bottom: var(--safe-area);
      right: var(--safe-area);
    }

    #logo.bottom-left {
      bottom: var(--safe-area);
      left: var(--safe-area);
    }

    #logo.top-right {
      top: var(--safe-area);
      right: var(--safe-area);
    }

    #logo.top-left {
      top: var(--safe-area);
      left: var(--safe-area);
    }

    /* ── Shared: Verse container ── */
    #verse-container {
      display: flex;
      flex-direction: column;
      align-items: var(--text-align, center);
      justify-content: center;
      width: 100%;
    }

    #verse-text {
      font-size: var(--font-size);
      font-family: var(--font-family);
      color: var(--font-color, #ffffff);
      font-weight: var(--font-weight, 400);
      font-style: var(--font-style, normal);
      line-height: var(--line-height);
      letter-spacing: var(--letter-spacing, 0px);
      text-align: var(--text-align);
      text-shadow: var(--text-shadow);
      -webkit-text-stroke: var(--outline-width) var(--outline-color);
      text-transform: var(--text-transform);
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    #translation-text {
      display: none;
      width: 100%;
      margin-top: clamp(16px, 2vh, 34px);
      font-size: var(--ref-font-size);
      font-family: var(--font-family);
      color: var(--font-color, #ffffff);
      font-weight: var(--font-weight, 400);
      font-style: var(--font-style, normal);
      line-height: 1.35;
      letter-spacing: var(--letter-spacing, 0px);
      text-align: var(--text-align);
      text-shadow: var(--text-shadow);
      text-transform: var(--text-transform);
      white-space: pre-line;
      opacity: 0.82;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    #reference {
      font-size: var(--ref-font-size);
      font-family: var(--ref-font-family);
      font-weight: var(--ref-font-weight);
      font-style: var(--ref-font-style, normal);
      color: var(--ref-font-color);
      text-align: var(--ref-text-align, var(--text-align));
      margin-top: var(--ref-spacing);
      width: var(--ref-width);
      padding: var(--ref-bg-padding);
      background: var(--ref-bg-color);
      border-radius: var(--ref-bg-radius);
      border: var(--ref-bg-border);
      opacity: var(--ref-opacity);
      text-transform: var(--ref-text-transform);
      letter-spacing: var(--ref-letter-spacing);
    }

    #reference.top {
      margin-top: 0;
      margin-bottom: var(--ref-spacing);
    }

    #reference:empty {
      display: none;
    }

    #translation-text:empty {
      display: none;
    }

    /* ══════════════════════════════════════════════════════
       FULLSCREEN LAYER (always inset:0, crossfades via opacity)
       ══════════════════════════════════════════════════════ */
    #background-shade {
      position: absolute;
      inset: 0;
      background: var(--bg-shade-gradient);
      display: var(--bg-shade-display);
      opacity: 1;
      transition: opacity var(--anim-duration, 152ms) ease;
      z-index: 2;
    }

    #overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: var(--padding, 64px);
      opacity: 1;
      transition: opacity var(--anim-duration, 152ms) ease;
    }

    #overlay.hidden,
    #overlay.blank {
      opacity: 0;
    }

    #verse-container {
      transition: opacity var(--anim-duration, 152ms) ease;
    }

    #verse-container.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Compare layout (fullscreen only) */
    #compare-layout {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: minmax(0, var(--compare-left-width, 40fr)) minmax(0, var(--compare-right-width, 40fr));
      gap: var(--compare-gap, 40px);
      width: 100%;
      height: 100%;
      padding: var(--compare-outer-padding-top, var(--padding)) var(--compare-outer-padding-right, var(--padding)) var(--compare-outer-padding-bottom, var(--padding)) var(--compare-outer-padding-left, var(--padding));
      align-content: center;
      align-items: stretch;
      z-index: 3;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--anim-duration, 152ms) ease;
    }

    #compare-layout.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .compare-column {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: var(--compare-panel-inner-padding, 38px);
    }

    .compare-column__text-wrap {
      flex: 0 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 0;
      overflow: hidden;
    }

    .compare-column__verse {
      font-size: var(--compare-font-size, 36px);
      font-family: var(--compare-font-family, var(--font-family));
      color: var(--font-color, #ffffff);
      font-weight: var(--compare-font-weight, var(--font-weight, 400));
      font-style: var(--font-style, normal);
      line-height: var(--compare-line-height, 1.4);
      letter-spacing: var(--letter-spacing, 0px);
      text-align: var(--compare-text-align, var(--text-align));
      text-shadow: var(--text-shadow);
      -webkit-text-stroke: var(--outline-width) var(--outline-color);
      text-transform: var(--text-transform);
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .compare-column__reference {
      font-size: var(--compare-ref-font-size, 20px);
      font-family: var(--compare-font-family, var(--ref-font-family));
      font-weight: var(--ref-font-weight);
      font-style: var(--ref-font-style, normal);
      color: var(--ref-font-color);
      text-align: var(--compare-reference-align, var(--ref-text-align, var(--compare-text-align, var(--text-align))));
      margin-top: var(--compare-reference-verse-spacing, 10px);
      width: var(--ref-width);
      padding: var(--ref-bg-padding);
      background: var(--ref-bg-color);
      border-radius: var(--ref-bg-radius);
      border: var(--ref-bg-border);
      opacity: var(--ref-opacity);
      text-transform: var(--compare-reference-transform, var(--ref-text-transform));
      letter-spacing: var(--ref-letter-spacing);
    }

    .compare-column__reference.is-above {
      order: -1;
      margin-top: 0;
      margin-bottom: var(--compare-reference-verse-spacing, 10px);
    }

    .compare-column__reference.is-hidden,
    .compare-column__reference:empty {
      display: none;
    }

    .compare-column__translation {
      display: none;
      font-size: var(--compare-ref-meta-size, 12px);
      color: rgba(255, 255, 255, 0.5);
      text-align: var(--text-align);
      margin-top: 4px;
    }

    /* ── Lower-third compare layout ── */
    .lt-compare-row {
      display: flex;
      align-items: stretch;
      gap: 16px;
      width: 100%;
    }

    .lt-compare-row .lt-compare-col {
      flex: 1 1 0;
      min-width: 0;
    }

    .lt-compare-row .lt-compare-divider {
      width: 1px;
      background: rgba(255, 255, 255, 0.2);
      flex-shrink: 0;
      align-self: stretch;
    }

    .lt-compare-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .lt-compare-stack .lt-compare-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.15);
      width: 100%;
    }

    .lt-compare-ref {
      display: block;
      font-size: 0.65em;
      color: rgba(255, 255, 255, 0.55);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lt-compare-col {
      display: block;
    }

    /* ══════════════════════════════════════════════════════
       LOWER-THIRD LAYER (always bottom, crossfades via opacity)
       ══════════════════════════════════════════════════════ */


    #lt-bar {
      display: flex;
      opacity: 1;
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      z-index: 3;
      width: calc(100vw - var(--lt-h-margin, 120px));
      max-width: var(--lt-max-width, 1680px);
      max-height: var(--lt-max-height, 600px);
      padding: var(--lt-card-padding, 28px 48px);
      border-radius: var(--lt-card-radius, 18px);
      overflow: hidden;
      isolation: isolate;
      flex-direction: column;
      align-items: var(--text-align, center);
      justify-content: center;
      transition: opacity var(--anim-duration, 152ms) ease;
    }

    #lt-bar.lt-edge-bottom {
      top: auto;
      right: auto;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100vw - var(--lt-h-margin, 120px));
      height: auto;
      max-width: var(--lt-max-width, 1680px);
      max-height: var(--lt-max-height, 600px);
    }

    #lt-bar.lt-edge-top {
      top: 0;
      right: auto;
      bottom: auto;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100vw - var(--lt-h-margin, 120px));
      height: auto;
      max-width: var(--lt-max-width, 1680px);
      max-height: var(--lt-max-height, 600px);
    }

    #lt-bar.lt-edge-left,
    #lt-bar.lt-edge-right {
      top: 50%;
      bottom: auto;
      width: var(--lt-side-width, 168px);
      height: calc(100vh - var(--lt-v-margin, 0px));
      max-width: none;
      max-height: none;
      align-items: center;
      justify-content: center;
    }

    #lt-bar.lt-edge-left {
      right: auto;
      left: 0;
      transform: translateY(-50%);
    }

    #lt-bar.lt-edge-right {
      right: 0;
      left: auto;
      transform: translateY(-50%);
    }

    /* ══════════════════════════════════════════════════════
       OVERLAY STAGE: fixed full-canvas parent container
       ══════════════════════════════════════════════════════ */
    #overlay-stage {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
      z-index: 0;
    }

    .mode-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms ease;
      z-index: 0;
    }

    .mode-layer.is-active {
      opacity: 1;
      pointer-events: auto;
    }

    @keyframes mce-preview-slide-fade {
      0%, 100% { opacity: 1; }
      45% { opacity: 0; }
    }

    .mode-layer.mce-preview-slide-fade {
      animation: mce-preview-slide-fade 220ms ease-in-out;
    }

    #lt-bar.hidden,
    #lt-bar.blank {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    #lt-bar::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--box-background, rgba(0, 0, 0, 0.65));
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: inherit;
      z-index: 0;
    }

    #lt-bar>* {
      position: relative;
      z-index: 1;
    }

    #lt-verse-text {
      font-size: var(--font-size);
      font-family: var(--font-family);
      color: var(--font-color, #ffffff);
      font-weight: var(--font-weight, 400);
      font-style: var(--font-style, normal);
      line-height: var(--line-height);
      letter-spacing: var(--letter-spacing, 0px);
      text-align: var(--text-align);
      text-shadow: var(--text-shadow);
      text-transform: var(--text-transform);
      transform-origin: center;
    }

    #lt-translation-text {
      display: none;
      width: 100%;
      margin-top: clamp(8px, 1vh, 18px);
      font-size: var(--ref-font-size);
      font-family: var(--font-family);
      color: var(--font-color, #ffffff);
      font-weight: var(--font-weight, 400);
      font-style: var(--font-style, normal);
      line-height: 1.3;
      letter-spacing: var(--letter-spacing, 0px);
      text-align: var(--text-align);
      text-shadow: var(--text-shadow);
      text-transform: var(--text-transform);
      white-space: pre-line;
      opacity: 0.82;
    }

    #lt-bar.lt-edge-left #lt-verse-text,
    #lt-bar.lt-edge-right #lt-verse-text {
      width: max-content;
      max-width: calc(100vh - 120px);
      white-space: nowrap;
      text-align: center;
      line-height: 1;
    }

    #lt-bar.lt-edge-left #lt-verse-text {
      transform: rotate(90deg);
    }

    #lt-bar.lt-edge-right #lt-verse-text {
      transform: rotate(-90deg);
    }

    #lt-bar.lt-text-inverted.lt-edge-bottom #lt-verse-text,
    #lt-bar.lt-text-inverted.lt-edge-top #lt-verse-text,
    #lt-bar.lt-text-inverted.lt-edge-bottom #ref-text,
    #lt-bar.lt-text-inverted.lt-edge-top #ref-text,
    #lt-bar.lt-text-inverted.lt-edge-bottom #lt-translation-text,
    #lt-bar.lt-text-inverted.lt-edge-top #lt-translation-text {
      transform: rotate(180deg);
      transform-origin: center;
    }

    #lt-bar.lt-edge-left.lt-text-inverted #lt-verse-text {
      transform: rotate(-90deg);
    }

    #lt-bar.lt-edge-right.lt-text-inverted #lt-verse-text {
      transform: rotate(90deg);
    }

    #lt-bar.lt-edge-left #ref-text,
    #lt-bar.lt-edge-right #ref-text,
    #lt-bar.lt-edge-left #lt-translation-text,
    #lt-bar.lt-edge-right #lt-translation-text {
      display: none !important;
    }

    #lt-bar #ref-text {
      font-size: var(--ref-font-size);
      font-weight: var(--ref-font-weight);
      font-style: var(--ref-font-style, normal);
      color: var(--ref-font-color);
      text-align: var(--ref-text-align, var(--text-align));
      opacity: var(--ref-opacity);
      text-transform: var(--ref-text-transform);
      letter-spacing: var(--ref-letter-spacing);
    }

    #lt-bar #ref-text.top {
      margin-top: 0;
      margin-bottom: 12px;
    }

    #lt-translation-text:empty {
      display: none;
    }

    #bar-background-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: inherit;
      display: none;
      z-index: 0;
    }

    #bar-background-video.visible {
      display: block;
    }

    #lt-bar-bg {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      z-index: 0;
    }
  </style>
</head>

<body data-mode="fullscreen">

  <!-- ══════════════════════════════════════
       OVERLAY STAGE — fixed full-canvas parent
       ══════════════════════════════════════ -->
  <div id="overlay-stage">

    <!-- ─── Fullscreen Layer ─── -->
    <div id="fullscreen-layer" class="mode-layer">
      <div id="background"></div>
      <div id="bg-crossfade"></div>
      <video id="background-video" muted playsinline></video>
      <div id="background-shade"></div>
      <div id="overlay" class="hidden">
        <div id="verse-container">
          <div id="verse-text"></div>
          <div id="reference"></div>
          <div id="translation-text"></div>
        </div>
      </div>
      <div id="compare-layout">
        <div class="compare-column">
          <div class="compare-column__text-wrap">
            <div class="compare-column__verse" id="compare-text-left"></div>
          </div>
          <div class="compare-column__reference" id="compare-reference-left"></div>
          <div class="compare-column__translation" id="compare-translation-left"></div>
        </div>
        <div class="compare-column">
          <div class="compare-column__text-wrap">
            <div class="compare-column__verse" id="compare-text-right"></div>
          </div>
          <div class="compare-column__reference" id="compare-reference-right"></div>
          <div class="compare-column__translation" id="compare-translation-right"></div>
        </div>
      </div>
      <img id="logo" alt="">
    </div>

    <!-- ─── Lower-Third Layer ─── -->
    <div id="lower-third-layer" class="mode-layer">
      <div id="lt-bar">
        <video id="bar-background-video" muted playsinline></video>
        <div id="lt-bar-bg"></div>
        <div id="lt-verse-text"></div>
        <div id="ref-text"></div>
        <div id="lt-translation-text"></div>
      </div>
    </div>

  </div>

  <script>
    (function () {
      'use strict';

      let currentBibleState = null;
      let currentBibleRevision = 0;
      let hasReceivedLiveOverlayUpdate = false;

      const SIZE_PRESETS = {
        'smallest': { fontSize: 24, refFontSize: 10, lineHeight: 1.25 },
        'smaller': { fontSize: 28, refFontSize: 10, lineHeight: 1.26 },
