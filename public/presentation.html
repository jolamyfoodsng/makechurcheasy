<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MakeChurchEasy Presentation</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050816;
      --bg-soft: #0d1328;
      --fg: #f8fafc;
      --muted: rgba(226, 232, 240, 0.76);
      --accent: #60a5fa;
      --panel: rgba(9, 14, 30, 0.72);
      --border: rgba(148, 163, 184, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at top, rgba(96, 165, 250, 0.18), transparent 32%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-soft) 100%);
      color: var(--fg);
      font-family: "Inter", "Segoe UI", sans-serif;
    }

    body {
      position: relative;
    }

    .screen {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .fullscreen-layer {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(32px, 5vw, 72px);
    }

    .fullscreen-shell {
      width: min(1200px, 100%);
      display: flex;
      flex-direction: column;
      gap: 22px;
      text-align: center;
      align-items: center;
    }

    .fullscreen-kicker {
      font-size: clamp(18px, 1.35vw, 28px);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .fullscreen-title {
      font-size: clamp(28px, 2vw, 40px);
      font-weight: 600;
      color: var(--muted);
    }

    .fullscreen-body {
      font-size: clamp(42px, 4.1vw, 78px);
      line-height: 1.12;
      font-weight: 700;
      white-space: pre-wrap;
    }

    .fullscreen-subtitle {
      display: none;
      font-size: clamp(22px, 1.75vw, 34px);
      line-height: 1.35;
      color: var(--muted);
      white-space: pre-wrap;
    }

    .fullscreen-image,
    .fullscreen-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    .fullscreen-media-mask {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(2, 6, 23, 0.08), rgba(2, 6, 23, 0.5));
    }

    .lower-third-layer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: clamp(18px, 3vw, 36px);
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .lower-third-card {
      min-width: min(720px, 100%);
      max-width: min(1400px, 100%);
      border: 1px solid var(--border);
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(8, 12, 26, 0.88), rgba(17, 24, 39, 0.88));
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.35);
      padding: 24px 28px;
      backdrop-filter: blur(18px);
    }

    .lt-title {
      font-size: clamp(28px, 2.4vw, 52px);
      font-weight: 800;
      line-height: 1.05;
    }

    .lt-subtitle,
    .lt-body {
      margin-top: 8px;
      font-size: clamp(18px, 1.25vw, 30px);
      line-height: 1.35;
      color: var(--muted);
      white-space: pre-wrap;
    }

    .countdown-wrap {
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
    }

    .countdown-clock {
      font-size: clamp(72px, 9vw, 168px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0.05em;
      font-variant-numeric: tabular-nums;
    }

    .countdown-message {
      font-size: clamp(22px, 1.8vw, 34px);
      color: var(--muted);
      text-align: center;
      white-space: pre-wrap;
    }

    .waiting {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .waiting-card {
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 24px;
      padding: 28px 32px;
      text-align: center;
      backdrop-filter: blur(18px);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.24);
    }

    .waiting-title {
      font-size: 24px;
      font-weight: 700;
    }

    .waiting-subtitle {
      margin-top: 10px;
      font-size: 16px;
      color: var(--muted);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <div class="screen">
    <div id="fullscreenLayer" class="fullscreen-layer hidden"></div>
    <div id="lowerThirdLayer" class="lower-third-layer hidden"></div>
    <div id="waiting" class="waiting">
      <div class="waiting-card">
        <div class="waiting-title">Presentation Ready</div>
        <div class="waiting-subtitle">Waiting for content from Presentation Console.</div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get("sessionId") || "";
      const wsPort = Number(params.get("wsPort") || "0");
      const viewerIdKey = `mce-presentation-viewer:${sessionId}`;
      const storageKey = `mce-presentation-state:${sessionId}`;
      const channelName = `mce-presentation:${sessionId}`;
      const fullscreenLayer = document.getElementById("fullscreenLayer");
      const lowerThirdLayer = document.getElementById("lowerThirdLayer");
      const waiting = document.getElementById("waiting");

      let state = null;
      let countdownTick = null;
      let socket = null;
      let heartbeatTick = null;
      let fallbackPollTick = null;
      let reconnectTimer = null;
      let reconnectAttempt = 0;
      const reconnectDelays = [1000, 3000, 5000, 10000];

      function getViewerId() {
        if (!sessionId) return "";
        try {
          const existing = sessionStorage.getItem(viewerIdKey);
          if (existing) return existing;
          const next = (self.crypto && crypto.randomUUID)
            ? crypto.randomUUID()
            : `viewer-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
          sessionStorage.setItem(viewerIdKey, next);
          return next;
        } catch {
          return `viewer-${Date.now()}`;
        }
      }

      const viewerId = getViewerId();

      function persistState(nextState) {
        if (!nextState || !nextState.sessionId) return;
        try {
          localStorage.setItem(storageKey, JSON.stringify(nextState));
        } catch {
          // Ignore storage failures.
        }
      }

      function formatDuration(totalSeconds, showHours, showMinutes, showSeconds) {
        const safeSeconds = Math.max(0, Math.floor(totalSeconds));
        const hours = Math.floor(safeSeconds / 3600);
        const minutes = Math.floor((safeSeconds % 3600) / 60);
        const seconds = safeSeconds % 60;
        const parts = [];

        if (showHours || hours > 0) {
          parts.push(String(hours).padStart(2, "0"));
        }
        if (showMinutes || parts.length > 0) {
          parts.push(String(minutes).padStart(2, "0"));
        }
        if (showSeconds || parts.length === 0) {
          parts.push(String(seconds).padStart(2, "0"));
        }
        return parts.join(":");
      }

      function getCountdownRemaining(payload) {
        if (!payload || !payload.config || !payload.config.timer) return 0;
        const timer = payload.config.timer;
        if (timer.mode === "end-at-time" && timer.endAt) {
          return Math.max(0, Math.floor((new Date(timer.endAt).getTime() - Date.now()) / 1000));
        }
        const startedAt = Number(payload.startedAt || Date.now());
        return Math.max(0, Number(timer.durationSeconds || 0) - Math.floor((Date.now() - startedAt) / 1000));
      }

      function clearCountdownTick() {
        if (countdownTick !== null) {
          window.clearInterval(countdownTick);
          countdownTick = null;
        }
      }

      function escapeHtml(value) {
        return String(value == null ? "" : value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function renderCountdown(target, item, compact) {
        const config = item.countdown && item.countdown.config;
        if (!config) {
          target.innerHTML = "";
          return;
        }

        const title = compact
          ? `<div class="lt-title">${escapeHtml(item.title || config.title || "Countdown")}</div>`
          : `<div class="fullscreen-title">${escapeHtml(item.title || config.title || "Countdown")}</div>`;
        const subtitle = item.subtitle || config.text && config.text.subtitle || "";
        const message = config.message && config.message.text ? config.message.text : "";

        target.innerHTML = `
            <div class="${compact ? "lower-third-card" : "fullscreen-shell"}">
              <div class="countdown-wrap">
                ${title}
                <div class="countdown-clock" id="${compact ? "ltCountdownClock" : "fsCountdownClock"}"></div>
                ${message ? `<div class="countdown-message">${escapeHtml(message)}</div>` : ""}
              </div>
            </div>
          `;

        const clock = target.querySelector(".countdown-clock");
        const updateClock = function () {
          if (!clock) return;
          const remaining = getCountdownRemaining(item.countdown);
          const timer = item.countdown.config.timer;
          clock.textContent = formatDuration(
            remaining,
            Boolean(timer.showHours),
            Boolean(timer.showMinutes),
            Boolean(timer.showSeconds),
          );
        };

        updateClock();
        clearCountdownTick();
        countdownTick = window.setInterval(updateClock, 1000);
      }

      function renderFullscreen(item) {
        if (!item) {
          fullscreenLayer.classList.add("hidden");
          return;
        }

        fullscreenLayer.classList.remove("hidden");

        if (item.countdown) {
          renderCountdown(fullscreenLayer, item, false);
          return;
        }

        if (item.videoUrl) {
          fullscreenLayer.innerHTML = `
              <video class="fullscreen-video" src="${escapeHtml(item.videoUrl)}" autoplay muted loop playsinline></video>
              <div class="fullscreen-media-mask"></div>
            `;
          return;
        }

        if (item.imageUrl) {
          fullscreenLayer.innerHTML = `
              <img class="fullscreen-image" src="${escapeHtml(item.imageUrl)}" alt="${escapeHtml(item.title || "Presentation media")}" />
              <div class="fullscreen-media-mask"></div>
            `;
          return;
        }

        fullscreenLayer.innerHTML = `
            <div class="fullscreen-shell">
              ${item.reference ? `<div class="fullscreen-kicker">${escapeHtml(item.reference)}</div>` : ""}
              ${item.title ? `<div class="fullscreen-title">${escapeHtml(item.title)}</div>` : ""}
              ${item.body ? `<div class="fullscreen-body">${escapeHtml(item.body)}</div>` : ""}
            </div>
          `;
      }

      function renderLowerThird(item) {
        if (!item) {
          lowerThirdLayer.classList.add("hidden");
          return;
        }

        lowerThirdLayer.classList.remove("hidden");

        if (item.countdown) {
          renderCountdown(lowerThirdLayer, item, true);
          return;
        }

        lowerThirdLayer.innerHTML = `
            <div class="lower-third-card">
              <div class="lt-title">${escapeHtml(item.title || item.reference || "")}</div>
              ${item.subtitle ? `<div class="lt-subtitle">${escapeHtml(item.subtitle)}</div>` : ""}
              ${item.body ? `<div class="lt-body">${escapeHtml(item.body)}</div>` : ""}
            </div>
          `;
      }

      function render(nextState) {
        state = nextState;
        persistState(nextState);
        const hasFullscreen = Boolean(state && state.fullscreen);
        const hasLowerThird = Boolean(state && state.lowerThird);
        waiting.classList.toggle("hidden", hasFullscreen || hasLowerThird);
        renderFullscreen(state ? state.fullscreen : null);
        renderLowerThird(state ? state.lowerThird : null);
        if (!hasFullscreen && !hasLowerThird) {
          clearCountdownTick();
        }
      }

      async function fetchState() {
        if (!sessionId) return;
        try {
          const response = await fetch(`/api/presentation-state?sessionId=${encodeURIComponent(sessionId)}`, {
            cache: "no-store",
          });
          if (!response.ok) return;
          const payload = await response.json();
          if (payload && payload.state) {
            render(payload.state);
          } else if (payload && payload.sessionId) {
            render(payload);
          }
        } catch {
          // Ignore network errors during polling.
        }
      }

      async function sendHeartbeat() {
        if (!sessionId || !viewerId) return;
        try {
          if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({
              type: "viewer_heartbeat",
              sessionId,
              viewerId,
            }));
            return;
          }
          await fetch("/api/presentation-viewer", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sessionId, viewerId }),
          });
        } catch {
          // Ignore heartbeat failures and retry on next interval.
        }
      }

      function clearReconnectTimer() {
        if (reconnectTimer !== null) {
          window.clearTimeout(reconnectTimer);
          reconnectTimer = null;
        }
      }

      function stopHeartbeat() {
        if (heartbeatTick !== null) {
          window.clearInterval(heartbeatTick);
          heartbeatTick = null;
        }
      }

      function startHeartbeat() {
        stopHeartbeat();
        heartbeatTick = window.setInterval(sendHeartbeat, 10000);
      }

      function stopFallbackPolling() {
        if (fallbackPollTick !== null) {
          window.clearInterval(fallbackPollTick);
          fallbackPollTick = null;
        }
      }

      function startFallbackPolling() {
        if (fallbackPollTick !== null) return;
        fallbackPollTick = window.setInterval(function () {
          if (document.visibilityState === "hidden") return;
          void fetchState();
          void sendHeartbeat();
        }, 15000);
      }

      function scheduleReconnect() {
        if (!sessionId || wsPort <= 0) {
          startFallbackPolling();
          return;
        }

        clearReconnectTimer();
        const delay = reconnectDelays[Math.min(reconnectAttempt, reconnectDelays.length - 1)];
        reconnectTimer = window.setTimeout(function () {
          reconnectTimer = null;
          reconnectAttempt += 1;
          connectWebSocket();
        }, delay);
      }

      function connectWebSocket() {
        if (!sessionId || wsPort <= 0) {
          startFallbackPolling();
          return;
        }

        if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) {
          return;
        }

        const wsProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const wsUrl = `${wsProtocol}//${window.location.hostname}:${wsPort}`;

        try {
          socket = new WebSocket(wsUrl);
        } catch {
          startFallbackPolling();
          scheduleReconnect();
          return;
        }

        socket.addEventListener("open", function () {
          reconnectAttempt = 0;
          clearReconnectTimer();
          stopFallbackPolling();
          startHeartbeat();
          socket.send(JSON.stringify({
            type: "viewer_hello",
            sessionId,
            viewerId,
          }));
          void fetchState();
        });

        socket.addEventListener("message", function (event) {
          try {
            const payload = JSON.parse(event.data);
            if (
              payload
              && payload.type === "presentation_state"
              && payload.sessionId === sessionId
              && payload.state
            ) {
              render(payload.state);
            }
          } catch {
            // Ignore invalid messages.
          }
        });

        socket.addEventListener("close", function () {
          socket = null;
          stopHeartbeat();
          startFallbackPolling();
          scheduleReconnect();
        });

        socket.addEventListener("error", function () {
          socket = null;
          stopHeartbeat();
          startFallbackPolling();
          scheduleReconnect();
        });
      }

      if (!sessionId) {
        waiting.querySelector(".waiting-title").textContent = "Presentation Link Invalid";
        waiting.querySelector(".waiting-subtitle").textContent = "Missing sessionId in the URL.";
        return;
      }

      try {
        const stored = localStorage.getItem(storageKey);
        if (stored) {
          const parsed = JSON.parse(stored);
          if (parsed && parsed.sessionId === sessionId) {
            render(parsed);
          }
        }
      } catch {
        // Ignore invalid local cache.
      }

      try {
        const channel = new BroadcastChannel(channelName);
        channel.onmessage = function (event) {
          if (event.data && event.data.sessionId === sessionId) {
            render(event.data);
          }
        };
      } catch {
        // BroadcastChannel is optional.
      }

      void fetchState();
      void sendHeartbeat();
      connectWebSocket();
      startFallbackPolling();

      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") {
          void fetchState();
          void sendHeartbeat();
          connectWebSocket();
        }
      });
    })();
  </script>
</body>

</html>
