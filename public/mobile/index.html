<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/mobile/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MakeChurchEasy mobile control for your OBS presentation.">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      color-scheme: dark;
      background: #0b1220;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #0b1220;
    }

    body {
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #boot-loader {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #0b1220;
      color: #f8fafc;
      z-index: 0;
      transition: opacity 180ms ease;
    }

    #boot-loader.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    #boot-loader__content {
      display: grid;
      justify-items: center;
      gap: 16px;
      text-align: center;
    }

    #boot-loader__mark {
      display: grid;
      width: 72px;
      height: 72px;
      place-items: center;
      border-radius: 18px;
      background: #1d4ed8;
      box-shadow: 0 16px 40px rgba(29, 78, 216, 0.28);
      font-size: 34px;
    }

    #boot-loader__title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    #boot-loader__status {
      color: #cbd5e1;
      font-size: 14px;
    }

    #boot-loader__progress {
      width: 112px;
      height: 3px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.25);
    }

    #boot-loader__progress::after {
      display: block;
      width: 44%;
      height: 100%;
      border-radius: inherit;
      background: #38bdf8;
      content: "";
      animation: boot-progress 1.1s ease-in-out infinite;
    }

    @keyframes boot-progress {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(340%); }
    }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MakeChurchEasy">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MakeChurchEasy</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="boot-loader" role="status" aria-live="polite">
    <div id="boot-loader__content">
      <div id="boot-loader__mark" aria-hidden="true">✦</div>
      <div id="boot-loader__title">MakeChurchEasy</div>
      <div id="boot-loader__status">Opening your control surface…</div>
      <div id="boot-loader__progress" aria-hidden="true"></div>
    </div>
  </div>
  <script>
    window.addEventListener("flutter-first-frame", () => {
      const loader = document.getElementById("boot-loader");
      if (!loader) return;
      loader.classList.add("is-hidden");
      window.setTimeout(() => loader.remove(), 220);
    }, { once: true });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
