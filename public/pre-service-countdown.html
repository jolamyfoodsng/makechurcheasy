<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pre-Service Countdown</title>
  <style>
    @import url('/fonts/fonts.css');

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .timer-display {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      font-weight: 700;
      font-size: clamp(80px, 25vw, 400px);
      line-height: 1;
      font-family: Inter, SF Pro Display, Arial, sans-serif;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.05em;
      user-select: none;
    }
  </style>
</head>

<body>
  <div id="timer" class="timer-display"></div>

  <script>
    let timerId = null;
    let totalDuration = 0;
    let startedAt = 0;

    const timerEl = document.getElementById("timer");

    function parsePayload() {
      try {
        const hash = window.location.hash || "";
        const marker = "#data=";
        if (!hash.startsWith(marker)) return null;
        return JSON.parse(decodeURIComponent(hash.slice(marker.length)));
      } catch { return null; }
    }

    function formatTime(seconds) {
      const s = Math.max(0, Math.floor(seconds));
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
    }

    function tick() {
      const elapsed = Math.floor((Date.now() - startedAt) / 1000);
      const remaining = Math.max(0, totalDuration - elapsed);

      timerEl.textContent = formatTime(remaining);

      if (remaining <= 0 && timerId) {
        clearInterval(timerId);
        timerId = null;
      }
    }

    function render() {
      const payload = parsePayload();
      if (!payload) return;

      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }

      totalDuration = Number(payload.seconds) || 600;
      startedAt = Date.now();

      tick();
      timerId = setInterval(tick, 250);
    }

    window.addEventListener("hashchange", render);
    render();
  </script>
</body>

</html>
