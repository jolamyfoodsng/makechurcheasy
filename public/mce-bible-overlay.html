<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, initial-scale=1">
  <title>MCE Bible Overlay</title>
  <style>
    /* ── Shared: Font-face ── */
    @font-face {
      font-family: 'Charis SIL';
      src: url('/fonts/charis-sil/CharisSIL-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }

    @font-face {
      font-family: 'Charis SIL';
      src: url('/fonts/charis-sil/CharisSIL-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }

    /* ── Shared: Reset ── */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: 'CMG Sans', 'Noto Sans', 'Charis SIL', Arial, sans-serif;
      background: transparent !important;
      color: #ffffff;
    }

    :root {
      --font-size: 48px;
      --font-family: 'CMG Sans', 'Noto Sans', 'Charis SIL', Arial, sans-serif;
      --font-color: #ffffff;
      --font-weight: 400;
      --font-style: normal;
      --line-height: 1.6;
      --letter-spacing: 0px;
      --text-align: center;
      --text-shadow: none;
      --outline-width: 0px;
      --outline-color: transparent;
      --ref-font-size: 24px;
      --ref-font-family: var(--font-family);
      --ref-font-weight: 400;
      --ref-font-style: normal;
      --ref-font-color: #ffffff;
      --ref-text-transform: none;
      --ref-letter-spacing: 0px;
      --ref-opacity: 1;
      --ref-spacing: 24px;
      --ref-text-align: center;
      --ref-width: 100%;
      --ref-bg-color: transparent;
      --ref-bg-padding: 0;
      --ref-bg-radius: 0;
      --ref-bg-border: none;
      --bg-color: transparent;
      --bg-image: none;
      --bg-opacity: 1;
      --bg-shade-gradient: linear-gradient(180deg, rgba(0, 0, 0, 0.42), rgba(0, 0, 0, 0.42));
      --bg-shade-display: block;
      --padding: 60px;
      --safe-area: 40px;
      --anim-duration: 152ms;
      --bg-enter-duration: 64ms;
      --text-enter-duration: 82ms;
      --text-enter-delay: 12ms;
      --text-transform: none;
      --logo-size: 80px;
      --compare-left-width: 40fr;
      --compare-right-width: 40fr;
      --compare-gap: 40px;
      --compare-outer-padding-top: var(--padding);
      --compare-outer-padding-right: var(--padding);
      --compare-outer-padding-bottom: var(--padding);
      --compare-outer-padding-left: var(--padding);
      --compare-panel-inner-padding: 38px;
      --compare-reference-verse-spacing: 16px;
      --compare-reference-align: var(--ref-text-align, center);
      --compare-reference-transform: var(--ref-text-transform, none);
    }

    html {
      background: transparent !important;
    }

    /* ── Shared: Background layers ── */
    #background {
      position: absolute;
      inset: 0;
      background-color: var(--bg-color);
      background-image: var(--bg-image);
      background-size: cover;
      background-position: center;
      opacity: var(--bg-opacity);
      z-index: 0;
    }

    #bg-crossfade {
      position: absolute;
      inset: 0;
      opacity: 0;
      z-index: 1;
      pointer-events: none;
    }

    #background-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      z-index: 0;
    }

    /* ── Shared: Logo ── */
    #logo {
      position: absolute;
      width: var(--logo-size);
      height: var(--logo-size);
      object-fit: contain;
      z-index: 10;
      display: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #logo.visible {
      display: block;
      opacity: 1;
    }

    #logo.bottom-right {
      bottom: var(--safe-area);
      right: var(--safe-area);
    }

    #logo.bottom-left {
      bottom: var(--safe-area);
      left: var(--safe-area);
    }

    #logo.top-right {
      top: var(--safe-area);
      right: var(--safe-area);
    }

    #logo.top-left {
      top: var(--safe-area);
      left: var(--safe-area);
    }

    /* ── Shared: Verse container ── */
    #verse-container {
      display: flex;
      flex-direction: column;
      align-items: var(--text-align, center);
      justify-content: center;
      width: 100%;
    }

    #verse-text {
      font-size: var(--font-size);
      font-family: var(--font-family);
      color: var(--font-color, #ffffff);
      font-weight: var(--font-weight, 400);
      font-style: var(--font-style, normal);
      line-height: var(--line-height);
      letter-spacing: var(--letter-spacing, 0px);
      text-align: var(--text-align);
      text-shadow: var(--text-shadow);
      -webkit-text-stroke: var(--outline-width) var(--outline-color);
      text-transform: var(--text-transform);
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    #reference {
      font-size: var(--ref-font-size);
      font-family: var(--ref-font-family);
      font-weight: var(--ref-font-weight);
      font-style: var(--ref-font-style, normal);
      color: var(--ref-font-color);
      text-align: var(--ref-text-align, var(--text-align));
      margin-top: var(--ref-spacing);
      width: var(--ref-width);
      padding: var(--ref-bg-padding);
      background: var(--ref-bg-color);
      border-radius: var(--ref-bg-radius);
      border: var(--ref-bg-border);
      opacity: var(--ref-opacity);
      text-transform: var(--ref-text-transform);
      letter-spacing: var(--ref-letter-spacing);
    }

    #reference.top {
      margin-top: 0;
      margin-bottom: var(--ref-spacing);
    }

    #reference:empty {
      display: none;
    }

    /* ══════════════════════════════════════════════════════
       FULLSCREEN MODE
       ══════════════════════════════════════════════════════ */
    body:not([data-mode="lower-third"]) #background-shade {
      position: absolute;
      inset: 0;
      background: var(--bg-shade-gradient);
      display: var(--bg-shade-display);
      z-index: 2;
    }

    body:not([data-mode="lower-third"]) #overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: var(--padding, 64px);
      opacity: 1;
      transition: opacity var(--anim-duration) ease;
    }

    body:not([data-mode="lower-third"]) #overlay.hidden {
      opacity: 0;
    }

    body:not([data-mode="lower-third"]) #overlay.blank {
      opacity: 0;
    }

    /* Compare layout (fullscreen only) */
    #compare-layout {
      display: none;
      grid-template-columns: minmax(0, var(--compare-left-width, 40fr)) minmax(0, var(--compare-right-width, 40fr));
      gap: var(--compare-gap, 40px);
      width: 100%;
      height: 100%;
      padding: var(--compare-outer-padding-top, var(--padding)) var(--compare-outer-padding-right, var(--padding)) var(--compare-outer-padding-bottom, var(--padding)) var(--compare-outer-padding-left, var(--padding));
      position: relative;
      z-index: 3;
    }

    body:not([data-mode="lower-third"]) #compare-layout.is-visible {
      display: grid;
    }

    .compare-column {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: var(--compare-panel-inner-padding, 38px);
    }

    .compare-column__text-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      overflow: hidden;
    }

    .compare-column__verse {
      font-size: var(--compare-font-size, 36px);
      font-family: var(--compare-font-family, var(--font-family));
      color: var(--font-color, #ffffff);
      font-weight: var(--compare-font-weight, var(--font-weight, 400));
      font-style: var(--font-style, normal);
      line-height: var(--compare-line-height, 1.4);
      letter-spacing: var(--letter-spacing, 0px);
      text-align: var(--compare-text-align, var(--text-align));
      text-shadow: var(--text-shadow);
      -webkit-text-stroke: var(--outline-width) var(--outline-color);
      text-transform: var(--text-transform);
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .compare-column__reference {
      font-size: var(--compare-ref-font-size, 20px);
      font-family: var(--compare-font-family, var(--ref-font-family));
      font-weight: var(--ref-font-weight);
      font-style: var(--ref-font-style, normal);
      color: var(--ref-font-color);
      text-align: var(--compare-reference-align, var(--ref-text-align, var(--compare-text-align, var(--text-align))));
      margin-top: var(--compare-reference-verse-spacing, 16px);
      width: var(--ref-width);
      padding: var(--ref-bg-padding);
      background: var(--ref-bg-color);
      border-radius: var(--ref-bg-radius);
      border: var(--ref-bg-border);
      opacity: var(--ref-opacity);
      text-transform: var(--compare-reference-transform, var(--ref-text-transform));
      letter-spacing: var(--ref-letter-spacing);
    }

    .compare-column__reference.is-above {
      order: -1;
      margin-top: 0;
      margin-bottom: var(--compare-reference-verse-spacing, 16px);
    }

    .compare-column__reference.is-hidden,
    .compare-column__reference:empty {
      display: none;
    }

    .compare-column__translation {
      display: none;
      font-size: var(--compare-ref-meta-size, 12px);
      color: rgba(255, 255, 255, 0.5);
      text-align: var(--text-align);
      margin-top: 4px;
    }

    /* ══════════════════════════════════════════════════════
       LOWER-THIRD MODE
       ══════════════════════════════════════════════════════ */
    body[data-mode="lower-third"] #fs-content {
      display: none !important;
    }

    body[data-mode="lower-third"] #background-shade {
      display: none !important;
    }

    body[data-mode="lower-third"] #compare-layout {
      display: none !important;
    }

    body[data-mode="lower-third"] #overlay {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity var(--anim-duration) ease;
    }

    body[data-mode="lower-third"] #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    body[data-mode="lower-third"] #overlay.blank {
      opacity: 0;
    }

    body[data-mode="lower-third"] #lt-bar {
      position: relative;
      width: calc(100vw - var(--lt-h-margin, 120px));
      max-width: var(--lt-max-width, 1680px);
      max-height: var(--lt-max-height, 600px);
      padding: var(--lt-card-padding, 28px 48px);
      border-radius: var(--lt-card-radius, 18px);
      overflow: hidden;
      z-index: 1;
      isolation: isolate;
    }

    #overlay,
    #compare-layout,
    #background-shade,
    #lt-bar {
      will-change: opacity, transform, filter;
      transform-origin: center center;
    }

    body.mode-switch-out[data-mode="fullscreen"] #overlay,
    body.mode-switch-out[data-mode="fullscreen"] #compare-layout.is-visible,
    body.mode-switch-out[data-mode="fullscreen"] #background-shade {
      opacity: 0;
      transform: translateY(18px) scale(0.985);
      filter: blur(6px);
      transition:
        opacity 150ms ease,
        transform 190ms cubic-bezier(0.22, 1, 0.36, 1),
        filter 150ms ease;
    }

    body.mode-switch-out[data-mode="lower-third"] #overlay,
    body.mode-switch-out[data-mode="lower-third"] #lt-bar {
      opacity: 0;
      transform: translateY(26px) scale(0.985);
      filter: blur(6px);
      transition:
        opacity 150ms ease,
        transform 190ms cubic-bezier(0.22, 1, 0.36, 1),
        filter 150ms ease;
    }

    body.mode-switch-in[data-mode="fullscreen"] #overlay,
    body.mode-switch-in[data-mode="fullscreen"] #compare-layout.is-visible {
      animation: modeFullscreenIn 250ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    body.mode-switch-in[data-mode="fullscreen"] #background-shade {
      animation: modeShadeIn 220ms ease both;
    }

    body.mode-switch-in[data-mode="lower-third"] #overlay,
    body.mode-switch-in[data-mode="lower-third"] #lt-bar {
      animation: modeLowerThirdIn 260ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    body[data-mode="lower-third"] #lt-bar::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--box-background, rgba(0, 0, 0, 0.65));
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: inherit;
      z-index: 0;
    }

    body[data-mode="lower-third"] #lt-bar>* {
      position: relative;
      z-index: 1;
    }

    body[data-mode="lower-third"] #lt-bar #verse-text {
      font-size: var(--font-size);
      font-family: var(--font-family);
      color: var(--font-color, #ffffff);
      font-weight: var(--font-weight, 400);
      font-style: var(--font-style, normal);
      line-height: var(--line-height);
      letter-spacing: var(--letter-spacing, 0px);
      text-align: var(--text-align);
      text-shadow: var(--text-shadow);
      text-transform: var(--text-transform);
    }

    body[data-mode="lower-third"] #lt-bar #reference {
      font-size: var(--ref-font-size);
      font-family: var(--ref-font-family);
      font-weight: var(--ref-font-weight);
      font-style: var(--ref-font-style, normal);
      color: var(--ref-font-color);
      text-align: var(--ref-text-align, var(--text-align));
      margin-top: 12px;
      width: auto;
      padding: 0;
      background: none;
      border: none;
      border-radius: 0;
      opacity: var(--ref-opacity);
      text-transform: var(--ref-text-transform);
      letter-spacing: var(--ref-letter-spacing);
    }

    body[data-mode="lower-third"] #lt-bar #reference.top {
      margin-top: 0;
      margin-bottom: 12px;
    }

    body[data-mode="lower-third"] #lt-ref-text {
      font-size: var(--ref-font-size);
      font-weight: var(--ref-font-weight);
      font-style: var(--ref-font-style, normal);
      color: var(--ref-font-color);
      text-align: var(--ref-text-align, var(--text-align));
      opacity: var(--ref-opacity);
      text-transform: var(--ref-text-transform);
      letter-spacing: var(--ref-letter-spacing);
    }

    #bar-background-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: inherit;
      display: none;
      z-index: 0;
    }

    #bar-background-video.visible {
      display: block;
    }

    body[data-mode="lower-third"] #lt-bar-bg {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      z-index: 0;
    }

    /* ══════════════════════════════════════════════════════
       ANIMATIONS
       ══════════════════════════════════════════════════════ */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideLeft {
      from {
        opacity: 0;
        transform: translateX(-40px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.92);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes textDelayed {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes shadeEnter {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes revealBg {
      from {
        clip-path: inset(0 0 100% 0);
      }

      to {
        clip-path: inset(0 0 0% 0);
      }
    }

    @keyframes modeFullscreenIn {
      from {
        opacity: 0;
        transform: translateY(22px) scale(0.986);
        filter: blur(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    @keyframes modeShadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes modeLowerThirdIn {
      from {
        opacity: 0;
        transform: translateY(28px) scale(0.982);
        filter: blur(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    .anim-fade-enter {
      animation: fadeIn var(--anim-duration) ease both;
    }

    .anim-slide-up-enter {
      animation: slideUp var(--anim-duration) ease both;
    }

    .anim-slide-left-enter {
      animation: slideLeft var(--anim-duration) ease both;
    }

    .anim-scale-in-enter {
      animation: scaleIn var(--anim-duration) ease both;
    }

    .anim-text-delayed-enter {
      animation: textDelayed var(--text-enter-duration) ease var(--text-enter-delay) both;
    }

    .anim-shade-enter {
      animation: shadeEnter var(--bg-enter-duration) ease both;
    }

    .anim-reveal-bg-enter {
      animation: revealBg var(--anim-duration) ease both;
    }
  </style>
</head>

<body data-mode="fullscreen">

  <!-- ═══ Shared: Background layers ═══ -->
  <div id="background"></div>
  <div id="bg-crossfade"></div>
  <video id="background-video" muted playsinline></video>

  <!-- ═══ Fullscreen-only: Shade ═══ -->
  <div id="background-shade"></div>

  <!-- ═══ Fullscreen-only: Overlay ═══ -->
  <div id="overlay" class="hidden">
    <div id="verse-container">
      <div id="verse-text"></div>
      <div id="reference"></div>
    </div>
  </div>

  <!-- ═══ Fullscreen-only: Compare layout ═══ -->
  <div id="compare-layout">
    <div class="compare-column">
      <div class="compare-column__text-wrap">
        <div class="compare-column__verse" id="compare-text-left"></div>
      </div>
      <div class="compare-column__reference" id="compare-reference-left"></div>
      <div class="compare-column__translation" id="compare-translation-left"></div>
    </div>
    <div class="compare-column">
      <div class="compare-column__text-wrap">
        <div class="compare-column__verse" id="compare-text-right"></div>
      </div>
      <div class="compare-column__reference" id="compare-reference-right"></div>
      <div class="compare-column__translation" id="compare-translation-right"></div>
    </div>
  </div>

  <!-- ═══ Lower-third-only: Bar ═══ -->
  <div id="lt-bar">
    <video id="bar-background-video" muted playsinline></video>
    <div id="lt-bar-bg"></div>
    <div id="ref-text"></div>
  </div>

  <img id="logo" alt="">

  <script>
    (function () {
      'use strict';

      const FONT_SIZE_MIN = 12;
      const REF_FONT_SIZE_MIN = 10;
      const COMPARE_TEXT_MIN = 16;
      const COMPARE_REF_MIN = 12;
      const COMPARE_META_MIN = 10;
      const COMPARE_PADDING_MIN = 16;
      const COMPARE_LAYOUT_PADDING_MIN = 20;
      const CONTENT_PADDING_MIN = 16;
      const CONTENT_LINE_HEIGHT_MIN = 1.1;
      const BAR_PADDING_MIN = 12;
      const BAR_LINE_HEIGHT_MIN = 1.2;

      const SIZE_PRESETS = {
        'smallest': { fontSize: 24, refFontSize: 13, lineHeight: 1.25 },
        'smaller': { fontSize: 28, refFontSize: 14, lineHeight: 1.26 },
        'small': { fontSize: 32, refFontSize: 16, lineHeight: 1.27 },
        'medium': { fontSize: 36, refFontSize: 18, lineHeight: 1.28 },
        'big': { fontSize: 42, refFontSize: 20, lineHeight: 1.29 },
        'bigger': { fontSize: 48, refFontSize: 22, lineHeight: 1.3 },
        'biggest': { fontSize: 56, refFontSize: 26, lineHeight: 1.32 },
      };
      const WIDTH_PRESETS = {
        'sm': { maxWidth: 1000, hMargin: 460 },
        'md': { maxWidth: 1200, hMargin: 360 },
        'lg': { maxWidth: 1440, hMargin: 240 },
        'xl': { maxWidth: 1680, hMargin: 120 },
        'xxl': { maxWidth: 1800, hMargin: 60 },
        'full': { maxWidth: 1920, hMargin: 0 },
      };

      function escapeHtml(s) { const d = document.createElement('div'); d.appendChild(document.createTextNode(s)); return d.innerHTML; }
      function safeSupText(h) {
        if (typeof h !== 'string') return '';
        return h.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      const PATTERN_CSS = {
        'dots': 'url("data:image/svg+xml,%3Csvg width=\'20\' height=\'20\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Ccircle cx=\'2\' cy=\'2\' r=\'1.5\' fill=\'rgba(255,255,255,0.15)\'/%3E%3C/svg%3E")',
        'lines': 'url("data:image/svg+xml,%3Csvg width=\'40\' height=\'40\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cline x1=\'0\' y1=\'20\' x2=\'40\' y2=\'20\' stroke=\'rgba(255,255,255,0.08)\' stroke-width=\'1\'/%3E%3C/svg%3E")',
        'grid': 'url("data:image/svg+xml,%3Csvg width=\'40\' height=\'40\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Crect width=\'40\' height=\'40\' fill=\'none\' stroke=\'rgba(255,255,255,0.07)\' stroke-width=\'0.5\'/%3E%3C/svg%3E")',

        verseText.innerHTML = safeSupText(sl.text); const rt = typeof sl.reference === 'string' ? sl.reference.trim() : ''; ltRefText.textContent = rt; reference.style.display = rt ? 'block' : 'none';
        try { applyTheme(data.theme || {}); } catch (error) { console.error('mce-bible-overlay lower-third theme error', error); }
        const anim = data.theme?.animation || 'slide-up'; lastAnimation = anim;
        if (modeTransitionActive) return;
        if (isNew && !hasShownOnce) { hasShownOnce = true; runEntranceAnimation(anim); }
      }

      /* ═══ EVENT-DRIVEN UPDATE PIPELINE ═══ */
      function readFromCssVar() {
        try {
          const raw = readInjectedCssVar('--overlay-data') || readComputedCssVar('--overlay-data');
          if (!raw || raw === lastCssOverlayData) return false;
          lastCssOverlayData = raw;
          const normalized = raw.replace(/^['"]|['"]$/g, '');
          if (!normalized) return false;
          processOverlayUpdate(JSON.parse(decodeURIComponent(normalized)));
          return true;
        } catch { }
        return false;
      }
      function readModeFromCssVar() { try { const raw = getComputedStyle(root).getPropertyValue('--display-mode').trim().replace(/^['"]|['"]$/g, ''); if (raw === 'lower-third' || raw === 'fullscreen') { if (raw !== currentMode) setMode(raw); } } catch { } }
      function readFromUrlHash() { try { const h = window.location.hash; if (h && h.startsWith('#data=')) { processOverlayUpdate(JSON.parse(decodeURIComponent(h.slice(6)))); return true; } } catch { } return false; }
      function readFromUrlSearch() { try { const raw = new URLSearchParams(window.location.search).get('overlayData'); if (raw) { processOverlayUpdate(JSON.parse(decodeURIComponent(raw))); return true; } } catch { } return false; }
      function readFromLocalStorage() { try { const raw = localStorage.getItem(_storageKey); if (raw) { processOverlayUpdate(JSON.parse(raw)); return true; } } catch { } return false; }
      function syncOverlayState() {
        if (readFromCssVar()) return true;
        if (readFromUrlHash()) return true;
        if (readFromUrlSearch()) return true;
        if (readFromLocalStorage()) return true;
        readModeFromCssVar();
        return false;
      }
      function syncCssOverlayState() {
        if (readFromCssVar()) return true;
        readModeFromCssVar();
        return false;
      }

      const _tabParam = new URLSearchParams(window.location.search).get('tab') || 'bible';
      const _storageKey = _tabParam === 'worship' ? 'worship-overlay-data' : 'bible-overlay-data';
      const _ackStorageKey = _tabParam === 'worship' ? 'worship-overlay-render-ack' : 'bible-overlay-render-ack';
      const _channelName = _tabParam === 'worship' ? 'obs-church-studio-worship-overlay' : 'obs-church-studio-bible-overlay';

      function writeRenderAck(data) {
        if (!data) return;
        try {
          localStorage.setItem(_ackStorageKey, JSON.stringify({
            timestamp: Number(data.timestamp) || Date.now(),
            mode: currentMode,
            slideId: data.slide?.id || '',
          }));
        } catch { }
      }

      try { const bc = new BroadcastChannel(_channelName); bc.onmessage = (e) => { processOverlayUpdate(e.data); }; } catch { }
      window.addEventListener('message', (e) => { if (e.data?.action === 'animate-out') processOverlayUpdate(e.data); });
      window.addEventListener('hashchange', () => { readFromUrlHash(); });

      const _observer = new MutationObserver(() => { syncCssOverlayState(); });
      _observer.observe(root, { attributes: true, attributeFilter: ['style'] });
      const _cssObserverTarget = document.head || document.documentElement;
      if (_cssObserverTarget) {
        const _cssObserver = new MutationObserver(() => { syncCssOverlayState(); });
        _cssObserver.observe(_cssObserverTarget, { childList: true, subtree: true, characterData: true });
      }

      if (window.ResizeObserver) { const ro = new ResizeObserver(() => { scheduleContentFit(); }); ro.observe(document.body); ro.observe(verseContainer); ro.observe(compareLayout); }

      /* ═══ INITIAL ═══ */
      ltBar.style.display = 'none';
      syncOverlayState();
      // CSS --overlay-data may not be injected by OBS yet — retry with backoff
      (function retryReadFromCssVar(attempts, delay) {
        if (!syncCssOverlayState() && attempts > 0) {
          setTimeout(function () { retryReadFromCssVar(attempts - 1, Math.round(delay * 1.5)); }, delay);
        }
      })(5, 50);

      /* ═══ POLLING — detect CSS variable updates from OBS SetInputSettings ═══
         OBS injects CSS via a <style> element (obs-cssoverride), NOT via the
         style attribute on <html>. The MutationObserver above only fires for
         style attribute changes, so CSS-only SetInputSettings calls are
         invisible to it. A lightweight poll bridges that gap. */
      setInterval(() => { syncOverlayState(); }, 75);
    })();
  </script>
