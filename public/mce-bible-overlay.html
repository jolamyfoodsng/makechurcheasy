<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>MCE Bible Overlay</title>
  <link href="/fonts/google/google-fonts.css" rel="stylesheet">
  <link href="/fonts/cmg-sans-fonts.css" rel="stylesheet">
  <script>
    (function() {
      document.addEventListener("keydown", function(e) { var c = e.ctrlKey || e.metaKey; if (!c) return; var k = e.key; if (k === "=" || k === "-" || k === "0" || k === "Plus" || k === "Minus" || k === "NumpadAdd" || k === "NumpadSubtract" || k === "Numpad0") { e.preventDefault(); e.stopPropagation(); } }, true);
      document.addEventListener("wheel", function(e) { if (e.ctrlKey || e.metaKey) e.preventDefault(); }, { passive: false, capture: true });
      document.addEventListener("gesturestart", function(e) { e.preventDefault(); }, { passive: false });
      document.addEventListener("gesturechange", function(e) { e.preventDefault(); }, { passive: false });
      document.addEventListener("gestureend", function(e) { e.preventDefault(); }, { passive: false });
    })();
  </script>
  <style>html,body,#overlay-root,#overlay-bg-buffer{touch-action:pan-y;-ms-content-zooming:none;}</style>
  <!-- ════════════════════════════════════════════════════════════
       VIEWPORT SCALING — Internal 1920×1080 canvas with
       viewport-based scale to decouple rendering from browser zoom.
       ════════════════════════════════════════════════════════════ -->
  <script>
    (function() {
      var W = 1920, H = 1080;
      var stage = document.getElementById('overlay-stage');
      if (!stage) return;
      stage.style.width = W + 'px';
      stage.style.height = H + 'px';
      stage.style.transformOrigin = '0 0';
      stage.style.position = 'absolute';
      stage.style.top = '0';
      stage.style.left = '0';
      function fit() {
        var s = Math.min(window.innerWidth / W, window.innerHeight / H);
        stage.style.transform = 'scale(' + s + ')';
      }
      fit();
      window.addEventListener('resize', fit);
    })();
  </script>
  <style>
    /* ── Shared: Font-face ── */
    @font-face {
      font-family: 'Charis SIL';
      src: url('/fonts/charis-sil/CharisSIL-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }

    @font-face {
      font-family: 'Charis SIL';
      src: url('/fonts/charis-sil/CharisSIL-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }

    /* ── Shared: Reset ── */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: 'Charis SIL', 'Noto Sans', 'CMG Sans', Arial, sans-serif;
      background: transparent !important;
      color: #ffffff;
    }

    :root {
      --font-size: 48px;
      --font-family: 'Charis SIL', 'Noto Sans', 'CMG Sans', Arial, sans-serif;
      --font-color: #ffffff;
      --font-weight: 400;
      --font-style: normal;
      --line-height: 1.6;
      --letter-spacing: 0px;
      --text-align: center;
      --text-shadow: none;
      --outline-width: 0px;
      --outline-color: transparent;
      --ref-font-size: 24px;
      --ref-font-family: var(--font-family);
      --ref-font-weight: 400;
      --ref-font-style: normal;
      --ref-font-color: #ffffff;
      --ref-text-transform: none;
      --ref-letter-spacing: 0px;
      --ref-opacity: 1;
      --ref-spacing: 24px;
      --ref-text-align: center;
      --ref-align-self: center;
      --ref-width: 100%;
      --ref-anchor-margin-left: auto;
      --ref-anchor-margin-right: auto;
      --ref-bg-color: transparent;
      --ref-bg-padding: 0;
      --ref-bg-radius: 0;
      --ref-bg-border: none;
      --bg-color: transparent;
      --bg-image: none;
      --bg-opacity: 1;
      --bg-shade-gradient: linear-gradient(180deg, rgba(0, 0, 0, 0.42), rgba(0, 0, 0, 0.42));
      --bg-shade-display: block;
      --padding: 60px;
      --safe-area: 40px;
      --anim-duration: 152ms;
      --bg-enter-duration: 64ms;
      --text-enter-duration: 82ms;
      --text-enter-delay: 12ms;
      --text-transform: none;
      --logo-size: 80px;
      --compare-left-width: 40fr;
      --compare-right-width: 40fr;
      --compare-gap: 40px;
      --compare-outer-padding-top: var(--padding);
      --compare-outer-padding-right: var(--padding);
      --compare-outer-padding-bottom: var(--padding);
      --compare-outer-padding-left: var(--padding);
      --compare-panel-inner-padding: 38px;
      --compare-reference-verse-spacing: 10px;
      --compare-reference-align: var(--ref-text-align, center);
      --compare-inline-align: var(--ref-align-self, center);
      --compare-reference-transform: var(--ref-text-transform, none);
    }

    html {
      background: transparent !important;
    }

    /* ── Shared: Background layers ── */
    #background {
      position: absolute;
      inset: 0;
      background-color: var(--bg-color);
      background-image: var(--bg-image);
      background-size: cover;
      background-position: center;
      opacity: var(--bg-opacity);
      z-index: 0;
    }

    #bg-crossfade {
      position: absolute;
      inset: 0;
      opacity: 0;
      z-index: 1;
      pointer-events: none;
    }

    #background-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      z-index: 0;
    }

    /* ── Shared: Logo ── */
    #logo {
      position: absolute;
      width: var(--logo-size);
      height: var(--logo-size);
      object-fit: contain;
      z-index: 10;
      display: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #logo.visible {
      display: block;
      opacity: 1;
    }

    #logo.bottom-right {
      bottom: var(--safe-area);
      right: var(--safe-area);
    }

    #logo.bottom-left {
      bottom: var(--safe-area);
      left: var(--safe-area);
    }

    #logo.top-right {
      top: var(--safe-area);
      right: var(--safe-area);
    }

    #logo.top-left {
      top: var(--safe-area);
      left: var(--safe-area);
    }

    /* ── Shared: Verse container ── */
    #verse-container {
      display: flex;
      flex-direction: column;
      align-items: var(--content-align-self, center);
      justify-content: center;
      width: 100%;
      max-width: 100%;
      max-height: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    #verse-text {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      font-size: var(--font-size);
      font-family: var(--font-family);
      color: var(--font-color, #ffffff);
      font-weight: var(--font-weight, 400);
      font-style: var(--font-style, normal);
      line-height: var(--line-height);
      letter-spacing: var(--letter-spacing, 0px);
      text-align: var(--text-align);
      text-shadow: var(--text-shadow);
      -webkit-text-stroke: var(--outline-width) var(--outline-color);
      text-transform: var(--text-transform);
      white-space: pre-line;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    #verse-text .verse-text__line,
    #lt-verse-text .verse-text__line,
    .compare-column__verse .verse-text__line,
    .lt-compare-col .verse-text__line {
      display: block;
    }

    #verse-text .verse-text__line + .verse-text__line,
    #lt-verse-text .verse-text__line + .verse-text__line,
    .compare-column__verse .verse-text__line + .verse-text__line,
    .lt-compare-col .verse-text__line + .verse-text__line {
      margin-top: 0.18em;
    }

    #reference {
      font-size: var(--ref-font-size);
      font-family: var(--ref-font-family);
      font-weight: var(--ref-font-weight);
      font-style: var(--ref-font-style, normal);
      color: var(--ref-font-color);
      text-align: var(--ref-text-align, var(--text-align));
      align-self: var(--ref-align-self, center);
      margin-top: var(--ref-spacing);
      width: var(--ref-width);
      max-width: 100%;
      box-sizing: border-box;
      padding: var(--ref-bg-padding);
      background: var(--ref-bg-color);
      border-radius: var(--ref-bg-radius);
      border: var(--ref-bg-border);
      opacity: var(--ref-opacity);
      text-transform: var(--ref-text-transform);
      letter-spacing: var(--ref-letter-spacing);
      order: 2;
    }

    #reference.top {
      margin-top: 0;
      margin-bottom: var(--ref-spacing);
      order: 0;
    }

    #reference:empty {
      display: none;
    }

    #overlay.ref-anchor-top #verse-container {
      padding-top: calc(var(--ref-font-size) + var(--ref-spacing) + 18px);
      box-sizing: border-box;
    }

    #overlay.ref-anchor-bottom #verse-container {
      padding-bottom: calc(var(--ref-font-size) + var(--ref-spacing) + 18px);
      box-sizing: border-box;
    }

    #overlay.ref-anchor-top #reference,
    #overlay.ref-anchor-bottom #reference {
      position: absolute;
      left: var(--padding, 64px);
      right: var(--padding, 64px);
      width: var(--ref-width);
      max-width: calc(100% - (var(--padding, 64px) * 2));
      margin: 0;
      margin-left: var(--ref-anchor-margin-left, auto);
      margin-right: var(--ref-anchor-margin-right, auto);
      z-index: 4;
    }

    #overlay.ref-anchor-top #reference {
      top: var(--padding, 64px);
    }

    #overlay.ref-anchor-bottom #reference {
      bottom: var(--padding, 64px);
    }

    /* ══════════════════════════════════════════════════════
       FULLSCREEN LAYER (always inset:0, crossfades via opacity)
       ══════════════════════════════════════════════════════ */
    #background-shade {
      position: absolute;
      inset: 0;
      background: var(--bg-shade-gradient);
      display: var(--bg-shade-display);
      opacity: 1;
      transition: opacity var(--anim-duration, 152ms) ease;
      z-index: 2;
    }

    #overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: var(--padding, 64px);
      opacity: 1;
      transition: opacity var(--anim-duration, 152ms) ease;
    }

    #overlay.hidden,
    #overlay.blank {
      opacity: 0;
    }

    #verse-container {
      transition: opacity var(--anim-duration, 152ms) ease;
    }

    #verse-container.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Compare layout (fullscreen only) */
    #compare-layout {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: minmax(0, var(--compare-left-width, 40fr)) minmax(0, var(--compare-right-width, 40fr));
      gap: var(--compare-gap, 40px);
      width: 100%;
      height: 100%;
      padding: var(--compare-outer-padding-top, var(--padding)) var(--compare-outer-padding-right, var(--padding)) var(--compare-outer-padding-bottom, var(--padding)) var(--compare-outer-padding-left, var(--padding));
      align-content: center;
      align-items: stretch;
      z-index: 3;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--anim-duration, 152ms) ease;
    }

    #compare-layout.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    #compare-layout.is-line-by-line {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      justify-items: center;
    }

    .compare-column {
      display: flex;
      flex-direction: column;
      /* Keep shorter translations centered against longer translations. */
      justify-content: center;
      padding: var(--compare-panel-inner-padding, 38px);
      min-width: 0;
      min-height: 0;
      max-height: 100%;
      overflow: hidden;
    }

    .compare-column__text-wrap {
      flex: 0 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 0;
      max-height: 100%;
      overflow: hidden;
    }

    .compare-column__verse {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      font-size: var(--compare-font-size, 36px);
      font-family: var(--compare-font-family, var(--font-family));
      color: var(--font-color, #ffffff);
      font-weight: var(--compare-font-weight, var(--font-weight, 400));
      font-style: var(--font-style, normal);
      line-height: var(--compare-line-height, 1.4);
      letter-spacing: var(--letter-spacing, 0px);
      text-align: var(--compare-text-align, var(--text-align));
      text-shadow: var(--text-shadow);
      -webkit-text-stroke: var(--outline-width) var(--outline-color);
      text-transform: var(--text-transform);
      white-space: pre-line;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .compare-column__reference {
      font-size: var(--compare-ref-font-size, 20px);
      font-family: var(--compare-font-family, var(--ref-font-family));
      font-weight: var(--ref-font-weight);
      font-style: var(--ref-font-style, normal);
      color: var(--ref-font-color);
      text-align: var(--compare-reference-align, var(--ref-text-align, var(--compare-text-align, var(--text-align))));
      align-self: var(--compare-inline-align, center);
      margin-top: var(--compare-reference-verse-spacing, 10px);
      width: var(--ref-width);
      padding: var(--ref-bg-padding);
      background: var(--ref-bg-color);
      border-radius: var(--ref-bg-radius);
      border: var(--ref-bg-border);
      opacity: var(--ref-opacity);
      text-transform: var(--compare-reference-transform, var(--ref-text-transform));
      letter-spacing: var(--ref-letter-spacing);
    }

    #compare-layout.is-line-by-line .compare-column__reference {
      align-self: center;
      width: fit-content;
      max-width: 100%;
      text-align: center;
    }

    #compare-layout.is-line-by-line .compare-column {
      align-items: stretch;
      justify-content: center;
      width: 100%;
      max-width: none;
      max-height: 100%;
      margin: 0;
      padding-left: 0 !important;
      padding-right: 0 !important;
    }

    #compare-layout.is-line-by-line .compare-column__text-wrap {
      align-items: stretch;
      justify-content: stretch;
      width: 100%;
      max-height: 100%;
    }

    #compare-layout.is-line-by-line .compare-column__verse {
      width: 100%;
      max-width: none;
      text-align: center;
    }

    #compare-layout.is-line-by-line .compare-column--line-hidden {
      display: none;
    }

    .compare-line-list {
      display: flex;
      flex-direction: column;
      gap: clamp(14px, 2.4vh, 28px);
      width: 100%;
      max-width: none;
    }

    .compare-line-unit {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0.34em;
      width: 100%;
      min-width: 0;
    }

    .compare-line-unit__translation {
      align-self: center;
      width: fit-content;
      max-width: 100%;
      padding: var(--ref-bg-padding);
      background: var(--ref-bg-color);
      border: var(--ref-bg-border);
      border-radius: var(--ref-bg-radius);
      color: var(--ref-font-color);
      font-family: var(--compare-font-family, var(--ref-font-family));
      font-size: max(12px, calc(var(--compare-ref-font-size, 20px) * 0.72));
      font-weight: var(--ref-font-weight);
      font-style: var(--ref-font-style, normal);
      letter-spacing: var(--ref-letter-spacing);
      line-height: 1;
      opacity: var(--ref-opacity);
      overflow: hidden;
      text-align: center;
      text-overflow: ellipsis;
      text-shadow: none;
      text-transform: var(--compare-reference-transform, var(--ref-text-transform));
      white-space: nowrap;
      -webkit-text-stroke: 0 transparent;
    }

    .compare-line-unit__text {
      width: 100%;
      max-width: none;
      min-width: 0;
      text-align: var(--compare-text-align, var(--text-align));
    }

    #compare-layout.is-line-by-line .compare-line-unit__text {
      text-align: center;
    }

    .compare-column__reference.is-above {
      order: -1;
      margin-top: 0;
      margin-bottom: var(--compare-reference-verse-spacing, 10px);
    }

    .compare-column__reference.is-hidden,
    .compare-column__reference:empty {
      display: none;
    }

    .compare-column__translation {
      display: none;
      font-size: var(--compare-ref-meta-size, 12px);
      color: rgba(255, 255, 255, 0.5);
      text-align: var(--text-align);
      margin-top: 4px;
    }

    /* ── Lower-third compare layout ── */
    .lt-compare-row {
      display: flex;
      align-items: stretch;
      gap: 16px;
      width: 100%;
      text-align: var(--compare-text-align, var(--text-align, center));
    }
    .lt-compare-row .lt-compare-unit {
      flex: 1 1 0;
      min-width: 0;
    }
    .lt-compare-row .lt-compare-divider {
      width: 1px;
      background: rgba(255,255,255,0.2);
      flex-shrink: 0;
      align-self: stretch;
    }
    .lt-compare-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      text-align: var(--compare-text-align, var(--text-align, center));
    }
    .lt-compare-stack .lt-compare-divider {
      height: 1px;
      background: rgba(255,255,255,0.15);
      width: 100%;
    }
    .lt-compare-unit {
      display: flex;
      flex-direction: column;
      align-items: var(--compare-inline-align, center);
      min-width: 0;
    }
    .lt-compare-ref {
      display: block;
      font-size: 0.65em;
      color: var(--ref-font-color, rgba(255,255,255,0.55));
      margin-bottom: var(--compare-reference-verse-spacing, 10px);
      max-width: 100%;
      width: fit-content;
      padding: var(--ref-bg-padding);
      background: var(--ref-bg-color);
      border-radius: var(--ref-bg-radius);
      border: var(--ref-bg-border);
      text-align: var(--compare-reference-align, var(--ref-text-align, center));
      text-transform: var(--compare-reference-transform, var(--ref-text-transform));
      letter-spacing: var(--ref-letter-spacing);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .lt-compare-col {
      display: block;
      width: 100%;
      text-align: var(--compare-text-align, var(--text-align, center));
    }

    /* ══════════════════════════════════════════════════════
       LOWER-THIRD LAYER (edge-positioned, crossfades via opacity)
       ══════════════════════════════════════════════════════ */


    #lt-bar {
      display: flex;
      opacity: 1;
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      z-index: 3;
      width: calc(100vw - var(--lt-h-margin, 120px));
      max-width: var(--lt-max-width, 1680px);
      max-height: var(--lt-max-height, 600px);
      padding: var(--lt-card-padding, 28px 48px);
      border-radius: var(--lt-card-radius, 18px);
      overflow: hidden;
      isolation: isolate;
      flex-direction: column;
      align-items: var(--content-align-self, center);
      justify-content: center;
      transition: opacity var(--anim-duration, 152ms) ease;
    }

    #lt-bar.lt-edge-bottom {
      top: auto;
      right: auto;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100vw - var(--lt-h-margin, 120px));
      height: auto;
      max-width: var(--lt-max-width, 1680px);
      max-height: var(--lt-max-height, 600px);
    }

    #lt-bar.lt-edge-top {
      top: 0;
      right: auto;
      bottom: auto;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100vw - var(--lt-h-margin, 120px));
      height: auto;
      max-width: var(--lt-max-width, 1680px);
      max-height: var(--lt-max-height, 600px);
    }

    #lt-bar.lt-edge-left,
    #lt-bar.lt-edge-right {
      top: 50%;
      bottom: auto;
      width: var(--lt-side-width, 168px);
      height: calc(100vh - var(--lt-v-margin, 0px));
      max-width: none;
      max-height: none;
      align-items: center;
      justify-content: center;
    }

    #lt-bar.lt-edge-left {
      right: auto;
      left: 0;
      transform: translateY(-50%);
    }

    #lt-bar.lt-edge-right {
      right: 0;
      left: auto;
      transform: translateY(-50%);
    }

    /* ══════════════════════════════════════════════════════
       OVERLAY STAGE: fixed full-canvas parent container
       ══════════════════════════════════════════════════════ */
    #overlay-stage {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
      z-index: 0;
    }

    .mode-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms ease;
      z-index: 0;
    }

    .mode-layer.is-active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Keep a freshly loaded source quiet until its saved Bible packet arrives.
       This prevents a lower-third source from painting the fullscreen layer
       for one frame during its first OBS load. */
    #overlay-loading {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: rgba(255, 255, 255, 0.88);
      font: 500 24px/1.2 'CMG Sans', 'Noto Sans', Arial, sans-serif;
      letter-spacing: 0.01em;
      background: transparent;
      opacity: 1;
      transition: opacity 140ms ease;
      pointer-events: none;
    }

    #overlay-loading.is-hidden {
      opacity: 0;
      visibility: hidden;
    }

    #overlay-loading__spinner {
      width: 22px;
      height: 22px;
      border: 2px solid rgba(255, 255, 255, 0.28);
      border-top-color: rgba(255, 255, 255, 0.92);
      border-radius: 50%;
      animation: mce-overlay-loading-spin 720ms linear infinite;
    }

    @keyframes mce-overlay-loading-spin {
      to { transform: rotate(360deg); }
    }

    /* Verse changes fade the text out completely before the new verse enters.
       The background remains visible throughout the handoff. */
    @keyframes mce-preview-text-exit {
      from { opacity: 1; }
      to { opacity: 0; }
    }

    @keyframes mce-preview-text-fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

          processOverlayUpdate(packet);
          return true;
        } catch { }
        return false;
      }
      function readFromOverlayRelayPacket(packet) {

          if (!packet || typeof packet !== 'object') return false;
          const targetSource = typeof packet.targetSource === 'string' ? packet.targetSource : '';
          if (_routeSource && targetSource !== _routeSource) return false;
          if (packet.channel && packet.channel !== _tabParam) return false;
          if (packet.type === 'mode-change' && packet.mode) {

            return true;
          }

        } catch { }

      }
      function connectOverlayRelay() {

        var timer = null;
        var disabledUntil = 0;

          if (timer) return;
          if (attempts >= 3) {
            disabledUntil = Date.now() + 60000;
            attempts = 0;
            timer = setTimeout(function () {
              timer = null;
              open();
            }, 60000);
            return;
          }
          var delay = Math.min(10000, 500 * Math.pow(2, attempts++));
          timer = setTimeout(function () {
            timer = null;
            open();
          }, delay);

        if (initialStorageSyncPending) {

        }
        if (readFromCssVar()) return true;
        if (readFromUrlHash()) return true;
        if (readFromUrlSearch()) return true;
        if (readFromLocalStorage()) return true;
        readModeFromCssVar();
        return false;
      }
      function syncCssOverlayState() {
        if (readFromCssVar()) return true;
        readModeFromCssVar();
        return false;
      }

      (function initialReveal(attempts) {

      /* ═══ POLLING — detect CSS variable updates from OBS SetInputSettings ═══

      /* ═══ STANDALONE BROWSER SUPPORT ═══

      window.__mceOverlay = {
        setActiveLayer: setActiveLayer,
        getState: function () {
          return { activeMode: activeMode, currentBibleRevision: currentBibleRevision };
        },
      };
    })();
