<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, initial-scale=1">
  <title>MCE Bible Overlay</title>
  <style>
    /* ── Shared: Font-face ── */
    @font-face {
      font-family: 'Charis SIL';
      src: url('/fonts/charis-sil/CharisSIL-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }

    @font-face {
      font-family: 'Charis SIL';
      src: url('/fonts/charis-sil/CharisSIL-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }

    /* ── Shared: Reset ── */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: 'CMG Sans', 'Noto Sans', 'Charis SIL', Arial, sans-serif;
      background: transparent !important;
      color: #ffffff;
      --font-size: 48px;
      --font-color: #ffffff;
      --font-weight: 400;
      --font-style: normal;
      --line-height: 1.6;
      --letter-spacing: 0px;
      --text-align: center;
      --text-shadow: none;
      --outline-width: 0px;
      --outline-color: transparent;
      --ref-font-size: 24px;
      --ref-font-weight: 400;
      --ref-font-style: normal;
      --ref-font-color: #ffffff;
      --ref-text-transform: none;
      --ref-letter-spacing: 0px;
      --ref-opacity: 1;
      --ref-spacing: 24px;
      --ref-text-align: center;
      --ref-width: 100%;
      --ref-bg-color: transparent;
      --ref-bg-padding: 0;
      --ref-bg-radius: 0;
      --ref-bg-border: none;
      --bg-color: transparent;
      --bg-image: none;
      --bg-opacity: 1;
      --bg-shade-gradient: linear-gradient(180deg, rgba(0, 0, 0, 0.42), rgba(0, 0, 0, 0.42));
      --bg-shade-display: block;
      --padding: 60px;
      --safe-area: 40px;
      --anim-duration: 152ms;
      --bg-enter-duration: 64ms;
      --text-enter-duration: 82ms;
      --text-enter-delay: 12ms;
      --text-transform: none;
      --logo-size: 80px;
    }

    html {
      background: transparent !important;
    }

    /* ── Shared: Background layers ── */
    #background {
      position: absolute;
      inset: 0;
      background-color: var(--bg-color);
      background-image: var(--bg-image);
      background-size: cover;
      background-position: center;
      opacity: var(--bg-opacity);
      z-index: 0;
    }

    #bg-crossfade {
      position: absolute;
      inset: 0;
      opacity: 0;
      z-index: 1;
      pointer-events: none;
    }

    #background-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      z-index: 0;
    }

    /* ── Shared: Logo ── */
    #logo {
      position: absolute;
      width: var(--logo-size);
      height: var(--logo-size);
      object-fit: contain;
      z-index: 10;
      display: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #logo.visible {
      display: block;
      opacity: 1;
    }

    #logo.bottom-right {
      bottom: var(--safe-area);
      right: var(--safe-area);
    }

    #logo.bottom-left {
      bottom: var(--safe-area);
      left: var(--safe-area);
    }

    #logo.top-right {
      top: var(--safe-area);
      right: var(--safe-area);
    }

    #logo.top-left {
      top: var(--safe-area);
      left: var(--safe-area);
    }

    /* ── Shared: Verse container ── */
    #verse-container {
      display: flex;
      flex-direction: column;
      align-items: var(--text-align, center);
      justify-content: center;
      width: 100%;
    }

    #verse-text {
      font-size: var(--font-size);
      font-family: 'CMG Sans', 'Noto Sans', 'Charis SIL', Arial, sans-serif;
      color: var(--font-color, #ffffff);
      font-weight: var(--font-weight, 400);
      font-style: var(--font-style, normal);
      line-height: var(--line-height);
      letter-spacing: var(--letter-spacing, 0px);
      text-align: var(--text-align);
      text-shadow: var(--text-shadow);
      -webkit-text-stroke: var(--outline-width) var(--outline-color);
      text-transform: var(--text-transform);
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    #reference {
      font-size: var(--ref-font-size);
      font-weight: var(--ref-font-weight);
      font-style: var(--ref-font-style, normal);
      color: var(--ref-font-color);
      text-align: var(--ref-text-align, var(--text-align));
      margin-top: var(--ref-spacing);
      width: var(--ref-width);
      padding: var(--ref-bg-padding);
      background: var(--ref-bg-color);
      border-radius: var(--ref-bg-radius);
      border: var(--ref-bg-border);
      opacity: var(--ref-opacity);
      text-transform: var(--ref-text-transform);
      letter-spacing: var(--ref-letter-spacing);
    }

    #reference.top {
      margin-top: 0;
      margin-bottom: var(--ref-spacing);
    }

    #reference:empty {
      display: none;
    }

    /* ══════════════════════════════════════════════════════
       FULLSCREEN MODE
       ══════════════════════════════════════════════════════ */
    body:not([data-mode="lower-third"]) #background-shade {
      position: absolute;
      inset: 0;
      background: var(--bg-shade-gradient);
      display: var(--bg-shade-display);
      z-index: 2;
    }

    body:not([data-mode="lower-third"]) #overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: var(--padding, 64px);
      opacity: 1;
      transition: opacity var(--anim-duration) ease;
    }

    body:not([data-mode="lower-third"]) #overlay.hidden {
      opacity: 0;
    }

    body:not([data-mode="lower-third"]) #overlay.blank {
      opacity: 0;
    }

    /* Compare layout (fullscreen only) */
    #compare-layout {
      display: none;
      grid-template-columns: minmax(0, 40fr) minmax(0, 40fr);
      gap: 40px;
      width: 100%;
      height: 100%;
      padding: var(--padding);
      position: relative;
      z-index: 3;
    }

    body:not([data-mode="lower-third"]) #compare-layout.is-visible {
      display: grid;
    }

    .compare-column {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 38px;
    }

    .compare-column__text-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      overflow: hidden;
    }

    .compare-column__verse {
      font-size: var(--compare-font-size, 36px);
      font-family: 'CMG Sans', 'Noto Sans', 'Charis SIL', Arial, sans-serif;
      color: var(--font-color, #ffffff);
      font-weight: var(--font-weight, 400);
      font-style: var(--font-style, normal);
      line-height: var(--compare-line-height, 1.4);
      letter-spacing: var(--letter-spacing, 0px);
      text-align: var(--text-align);
      text-shadow: var(--text-shadow);
      -webkit-text-stroke: var(--outline-width) var(--outline-color);
      text-transform: var(--text-transform);
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .compare-column__reference {
      font-size: var(--compare-ref-font-size, 20px);
      font-weight: var(--ref-font-weight);
      font-style: var(--ref-font-style, normal);
      color: var(--ref-font-color);
      text-align: var(--ref-text-align, var(--text-align));
      margin-top: 16px;
      width: var(--ref-width);
      padding: var(--ref-bg-padding);
      background: var(--ref-bg-color);
      border-radius: var(--ref-bg-radius);
      border: var(--ref-bg-border);
      opacity: var(--ref-opacity);
      text-transform: var(--ref-text-transform);
      letter-spacing: var(--ref-letter-spacing);
    }

    .compare-column__translation {
      font-size: var(--compare-ref-meta-size, 12px);
      color: rgba(255, 255, 255, 0.5);
      text-align: var(--text-align);
      margin-top: 4px;
    }

    /* ══════════════════════════════════════════════════════
       LOWER-THIRD MODE
       ══════════════════════════════════════════════════════ */
    body[data-mode="lower-third"] #fs-content {
      display: none !important;
    }

    body[data-mode="lower-third"] #background-shade {
      display: none !important;
    }

    body[data-mode="lower-third"] #compare-layout {
      display: none !important;
    }

    body[data-mode="lower-third"] #overlay {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity var(--anim-duration) ease;
    }

    body[data-mode="lower-third"] #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    body[data-mode="lower-third"] #overlay.blank {
      opacity: 0;
    }

    body[data-mode="lower-third"] #lt-bar {
      position: relative;
      width: calc(100vw - var(--lt-h-margin, 120px));
      max-width: var(--lt-max-width, 1680px);
      max-height: var(--lt-max-height, 600px);
      padding: var(--lt-card-padding, 28px 48px);
      border-radius: var(--lt-card-radius, 18px);
      overflow: hidden;
      z-index: 1;
      isolation: isolate;
    }

    body[data-mode="lower-third"] #lt-bar::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--box-background, rgba(0, 0, 0, 0.65));
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: inherit;
      z-index: 0;
    }

    body[data-mode="lower-third"] #lt-bar>* {
      position: relative;
      z-index: 1;
    }

    body[data-mode="lower-third"] #lt-bar #verse-text {
      font-size: var(--font-size);
      color: var(--font-color, #ffffff);
      font-weight: var(--font-weight, 400);
      font-style: var(--font-style, normal);
      line-height: var(--line-height);
      letter-spacing: var(--letter-spacing, 0px);
      text-align: var(--text-align);
      text-shadow: var(--text-shadow);
      text-transform: var(--text-transform);
    }

    body[data-mode="lower-third"] #lt-bar #reference {
      font-size: var(--ref-font-size);
      font-weight: var(--ref-font-weight);
      font-style: var(--ref-font-style, normal);
      color: var(--ref-font-color);
      text-align: var(--ref-text-align, var(--text-align));
      margin-top: 12px;
      width: auto;
      padding: 0;
      background: none;
      border: none;
      border-radius: 0;
      opacity: var(--ref-opacity);
      text-transform: var(--ref-text-transform);
      letter-spacing: var(--ref-letter-spacing);
    }

    body[data-mode="lower-third"] #lt-bar #reference.top {
      margin-top: 0;
      margin-bottom: 12px;
    }

    body[data-mode="lower-third"] #lt-ref-text {
      font-size: var(--ref-font-size);
      font-weight: var(--ref-font-weight);
      font-style: var(--ref-font-style, normal);
      color: var(--ref-font-color);
      text-align: var(--ref-text-align, var(--text-align));
      opacity: var(--ref-opacity);
      text-transform: var(--ref-text-transform);
      letter-spacing: var(--ref-letter-spacing);
    }

    #bar-background-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: inherit;
      display: none;
      z-index: 0;
    }

    #bar-background-video.visible {
      display: block;
    }

    body[data-mode="lower-third"] #lt-bar-bg {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      z-index: 0;
    }

    /* ══════════════════════════════════════════════════════
       ANIMATIONS
       ══════════════════════════════════════════════════════ */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideLeft {
      from {
        opacity: 0;
        transform: translateX(-40px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.92);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes textDelayed {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes shadeEnter {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes revealBg {
      from {
        clip-path: inset(0 0 100% 0);
      }

      to {
        clip-path: inset(0 0 0% 0);
      }
    }

    .anim-fade-enter {
      animation: fadeIn var(--anim-duration) ease both;
    }

    .anim-slide-up-enter {
      animation: slideUp var(--anim-duration) ease both;
    }

    .anim-slide-left-enter {
      animation: slideLeft var(--anim-duration) ease both;
    }

    .anim-scale-in-enter {
      animation: scaleIn var(--anim-duration) ease both;
    }

    .anim-text-delayed-enter {
      animation: textDelayed var(--text-enter-duration) ease var(--text-enter-delay) both;
    }

    .anim-shade-enter {
      animation: shadeEnter var(--bg-enter-duration) ease both;
    }

    .anim-reveal-bg-enter {
      animation: revealBg var(--anim-duration) ease both;
    }
  </style>
</head>

<body data-mode="fullscreen">

  <!-- ═══ Shared: Background layers ═══ -->
  <div id="background"></div>
  <div id="bg-crossfade"></div>
  <video id="background-video" muted playsinline></video>

  <!-- ═══ Fullscreen-only: Shade ═══ -->
  <div id="background-shade"></div>

  <!-- ═══ Fullscreen-only: Overlay ═══ -->
  <div id="overlay" class="hidden">
    <div id="verse-container">
      <div id="verse-text"></div>
      <div id="reference"></div>
    </div>
  </div>

  <!-- ═══ Fullscreen-only: Compare layout ═══ -->
  <div id="compare-layout">
    <div class="compare-column">
      <div class="compare-column__text-wrap">
        <div class="compare-column__verse" id="compare-text-left"></div>
      </div>
      <div class="compare-column__reference" id="compare-reference-left"></div>
      <div class="compare-column__translation" id="compare-translation-left"></div>
    </div>
    <div class="compare-column">
      <div class="compare-column__text-wrap">
        <div class="compare-column__verse" id="compare-text-right"></div>
      </div>
      <div class="compare-column__reference" id="compare-reference-right"></div>
      <div class="compare-column__translation" id="compare-translation-right"></div>
    </div>
  </div>

  <!-- ═══ Lower-third-only: Bar ═══ -->
  <div id="lt-bar">
    <video id="bar-background-video" muted playsinline></video>
    <div id="lt-bar-bg"></div>
    <div id="ref-text"></div>
  </div>

  <img id="logo" alt="">

  <script>
    (function () {
      'use strict';

      const FONT_SIZE_MIN = 12;
      const REF_FONT_SIZE_MIN = 10;
      const COMPARE_TEXT_MIN = 16;
      const COMPARE_REF_MIN = 12;
      const COMPARE_META_MIN = 10;
      const COMPARE_PADDING_MIN = 16;
      const COMPARE_LAYOUT_PADDING_MIN = 20;
      const CONTENT_PADDING_MIN = 16;
      const CONTENT_LINE_HEIGHT_MIN = 1.1;
      const BAR_PADDING_MIN = 12;
      const BAR_LINE_HEIGHT_MIN = 1.2;

      const SIZE_PRESETS = {
        'smallest': { fontSize: 24, refFontSize: 13, lineHeight: 1.25 },
        'smaller': { fontSize: 28, refFontSize: 14, lineHeight: 1.26 },
        'small': { fontSize: 32, refFontSize: 16, lineHeight: 1.27 },
        'medium': { fontSize: 36, refFontSize: 18, lineHeight: 1.28 },
        'big': { fontSize: 42, refFontSize: 20, lineHeight: 1.29 },
        'bigger': { fontSize: 48, refFontSize: 22, lineHeight: 1.3 },
        'biggest': { fontSize: 56, refFontSize: 26, lineHeight: 1.32 },
      };
      const WIDTH_PRESETS = {
        'sm': { maxWidth: 1000, hMargin: 460 },
        'md': { maxWidth: 1200, hMargin: 360 },
        'lg': { maxWidth: 1440, hMargin: 240 },
        'xl': { maxWidth: 1680, hMargin: 120 },
        'xxl': { maxWidth: 1800, hMargin: 60 },
        'full': { maxWidth: 1920, hMargin: 0 },
      };

      function escapeHtml(s) { const d = document.createElement('div'); d.appendChild(document.createTextNode(s)); return d.innerHTML; }
      function safeSupText(h) {
        if (typeof h !== 'string') return '';
        return h.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      const PATTERN_CSS = {
        'dots': 'url("data:image/svg+xml,%3Csvg width=\'20\' height=\'20\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Ccircle cx=\'2\' cy=\'2\' r=\'1.5\' fill=\'rgba(255,255,255,0.15)\'/%3E%3C/svg%3E")',
        'lines': 'url("data:image/svg+xml,%3Csvg width=\'40\' height=\'40\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cline x1=\'0\' y1=\'20\' x2=\'40\' y2=\'20\' stroke=\'rgba(255,255,255,0.08)\' stroke-width=\'1\'/%3E%3C/svg%3E")',
        'grid': 'url("data:image/svg+xml,%3Csvg width=\'40\' height=\'40\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Crect width=\'40\' height=\'40\' fill=\'none\' stroke=\'rgba(255,255,255,0.07)\' stroke-width=\'0.5\'/%3E%3C/svg%3E")',
        'crosshatch': 'url("data:image/svg+xml,%3Csvg width=\'20\' height=\'20\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cpath d=\'M0 0L20 20M20 0L0 20\' stroke=\'rgba(255,255,255,0.06)\' stroke-width=\'0.5\'/%3E%3C/svg%3E")',
        'diagonal': 'url("data:image/svg+xml,%3Csvg width=\'20\' height=\'20\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cpath d=\'M0 20L20 0\' stroke=\'rgba(255,255,255,0.1)\' stroke-width=\'1\'/%3E%3C/svg%3E")',
        'hexagons': 'url("data:image/svg+xml,%3Csvg width=\'28\' height=\'49\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cpath d=\'M14 0l14 8v16l-14 8-14-8V8z\' fill=\'none\' stroke=\'rgba(255,255,255,0.07)\' stroke-width=\'0.5\'/%3E%3C/svg%3E")',
        'waves': 'url("data:image/svg+xml,%3Csvg width=\'80\' height=\'20\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cpath d=\'M0 10q20-10 40 0t40 0\' fill=\'none\' stroke=\'rgba(255,255,255,0.08)\' stroke-width=\'1\'/%3E%3C/svg%3E")',
        'plus': 'url("data:image/svg+xml,%3Csvg width=\'24\' height=\'24\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cpath d=\'M11 4h2v16h-2zM4 11h16v2H4z\' fill=\'rgba(255,255,255,0.07)\'/%3E%3C/svg%3E")',
        'diamonds': 'url("data:image/svg+xml,%3Csvg width=\'24\' height=\'24\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cpath d=\'M12 0l12 12-12 12L0 12z\' fill=\'none\' stroke=\'rgba(255,255,255,0.06)\' stroke-width=\'0.5\'/%3E%3C/svg%3E")',
        'circles': 'url("data:image/svg+xml,%3Csvg width=\'30\' height=\'30\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Ccircle cx=\'15\' cy=\'15\' r=\'12\' fill=\'none\' stroke=\'rgba(255,255,255,0.06)\' stroke-width=\'0.5\'/%3E%3C/svg%3E")',
        'triangle': 'url("data:image/svg+xml,%3Csvg width=\'24\' height=\'24\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cpath d=\'M12 2l10 18H2z\' fill=\'none\' stroke=\'rgba(255,255,255,0.07)\' stroke-width=\'0.5\'/%3E%3C/svg%3E")',
      };

      const root = document.documentElement;
      const body = document.body;
      const background = document.getElementById('background');
      const bgCrossfade = document.getElementById('bg-crossfade');
      const backgroundVideoEl = document.getElementById('background-video');
      const backgroundShade = document.getElementById('background-shade');
      const overlay = document.getElementById('overlay');
      const verseContainer = document.getElementById('verse-container');
      const verseText = document.getElementById('verse-text');
      const reference = document.getElementById('reference');
      const compareLayout = document.getElementById('compare-layout');
      const compareTextLeft = document.getElementById('compare-text-left');
      const compareTextRight = document.getElementById('compare-text-right');
      const compareReferenceLeft = document.getElementById('compare-reference-left');
      const compareReferenceRight = document.getElementById('compare-reference-right');
      const compareTranslationLeft = document.getElementById('compare-translation-left');
      const compareTranslationRight = document.getElementById('compare-translation-right');
      const ltBar = document.getElementById('lt-bar');
      const ltBarBg = document.getElementById('lt-bar-bg');
      const barBackgroundVideoEl = document.getElementById('bar-background-video');
      const ltRefText = document.getElementById('ref-text');
      const logo = document.getElementById('logo');

      let currentMode = 'fullscreen';
      let currentOverlayData = null;
      let lastTimestamp = 0;
      let currentSlideId = null;
      let hasShownOnce = false;
      let lastAnimation = 'fade';
      let bgClearToken = 0;
      let lastCssOverlayData = '';
      let fitRafId = 0;
      let lastBgFingerprint = '';
      let lastBgType = 'none';
      let bgTransitionSuppressed = false;
      let contentFadeLock = false;
      let baseFontSize = 48;
      let baseRefFontSize = 24;
      let baseCompareFontSize = 36;
      let baseCompareRefFontSize = 20;
      let basePadding = 60;
      let baseBarPadding = 28;
      let barMaxHeight = 600;

      function toCssFontWeight(w, fb) {
        const n = Number(w); if (!n || isNaN(n)) return fb || '400';
        if (n <= 100) return '100'; if (n <= 200) return '200'; if (n <= 300) return '300';
        if (n <= 400) return '400'; if (n <= 500) return '500'; if (n <= 600) return '600';
        if (n <= 700) return '700'; if (n <= 800) return '800'; return '900';

          if (!pc) { if (hasG) { root.setProperty('--bg-color', 'transparent'); if (!bgVideoUrl && !s.backgroundImage) root.setProperty('--bg-image', bgc); } else root.setProperty('--bg-color', bgc); }

      /* ═══ THEME: Lower-third ═══ */
      function applyThemeLowerThird(s) {
        applyThemeBase(s);
        baseBarPadding = Number(s.padding || 18); root.setProperty('--safe-area', (s.safeArea || 40) + 'px');

      }

      function applyTheme(theme) {
        if (currentMode === 'lower-third') applyThemeLowerThird(theme); else applyThemeFullscreen(theme);
      }

      /* ═══ SINGLE RENDERER ═══ */
      function hasRenderableSlide(data) {
        return Boolean(data && data.slide && data.blanked !== true);
      }

      function processOverlayUpdate(data) {
        if (!data) return;
        const incomingTs = Number(data.timestamp) || 0;
        const incomingHasSlide = hasRenderableSlide(data);
        const currentHasSlide = hasRenderableSlide(currentOverlayData);
        if (incomingTs && incomingTs <= lastTimestamp && !(incomingHasSlide && !currentHasSlide)) return;
        lastTimestamp = Math.max(lastTimestamp, incomingTs);
        currentOverlayData = data;
        if (data.mode && data.mode !== currentMode) setMode(data.mode);
        if (currentMode === 'lower-third') processSlideLowerThird(data); else processSlideFullscreen(data);
      }

      function processSlideFullscreen(data) {
        if (!data.slide) { bgClearToken++; overlay.classList.add('blank'); const tk = bgClearToken; setTimeout(() => { if (tk === bgClearToken) { overlay.classList.add('hidden'); currentSlideId = null; hasShownOnce = false; } }, 280); return; }
        bgClearToken++; const sl = data.slide, isNew = sl.id !== currentSlideId, isSame = sl.id === currentSlideId && !isNew; currentSlideId = sl.id;
        if (data.blanked) { overlay.classList.add('blank'); return; } else overlay.classList.remove('blank');
        const cc = Array.isArray(sl.columns) ? sl.columns.slice(0, 2) : [], isCL = sl.layout === 'compare' && cc.length === 2;
        overlay.classList.remove('hidden');
        if (isCL) {
          verseContainer.style.display = 'none';
          compareLayout.classList.add('is-visible');
          const [l, r] = cc;
          compareReferenceLeft.textContent = String(l.reference || '').trim();
          compareReferenceRight.textContent = String(r.reference || '').trim();
          compareTranslationLeft.textContent = String(l.translation || '').trim();
          compareTranslationRight.textContent = String(r.translation || '').trim();
          compareTextLeft.innerHTML = safeSupText(l.text);
          compareTextRight.innerHTML = safeSupText(r.text);
        }
        else {
          compareLayout.classList.remove('is-visible');
          verseContainer.style.display = 'flex';
          verseText.innerHTML = safeSupText(sl.text);
          const rt = typeof sl.reference === 'string' ? sl.reference.trim() : '';
          reference.textContent = rt;
          reference.style.display = rt ? 'block' : 'none';
        }
        try { applyTheme(data.theme || {}); } catch (error) { console.error('mce-bible-overlay fullscreen theme error', error); }
        if (isCL) autoScaleCompareContent();
        else { autoScaleContent(); scheduleContentFit(); }
        const anim = data.theme?.animation || 'fade'; lastAnimation = anim;
        if (isNew) { if (!hasShownOnce) { hasShownOnce = true; runEntranceAnimation(anim); } }
        else if (isSame && anim !== 'none' && hasShownOnce) { clearEntranceAnimationClasses(); void verseContainer.offsetWidth; const ed = Math.max(95, Math.min(170, Math.round((data.theme?.animationDuration || 400) * 0.38))); const el = Date.now() % ed, d = -el; if (anim === 'fade') { verseContainer.style.animationDelay = d + 'ms'; verseContainer.classList.add('anim-fade-enter'); } else if (anim === 'slide-up') { verseContainer.style.animationDelay = d + 'ms'; verseContainer.classList.add('anim-slide-up-enter'); } else if (anim === 'slide-left') { verseContainer.style.animationDelay = d + 'ms'; verseContainer.classList.add('anim-slide-left-enter'); } else if (anim === 'scale-in') { verseContainer.style.animationDelay = d + 'ms'; verseContainer.classList.add('anim-scale-in-enter'); } setTimeout(() => { verseContainer.style.animationDelay = ''; }, ed + 50); }
      }

      function processSlideLowerThird(data) {
        if (data.action === 'animate-out') { overlay.classList.remove('hidden'); overlay.classList.add('blank'); return new Promise((r) => { _animateOutResolve = r; }); }
        if (!data.slide) { bgClearToken++; overlay.classList.add('blank'); const tk = bgClearToken; setTimeout(() => { if (tk === bgClearToken) { overlay.classList.add('hidden'); currentSlideId = null; hasShownOnce = false; } }, 280); return; }
        bgClearToken++; const sl = data.slide, isNew = sl.id !== currentSlideId; currentSlideId = sl.id;
        if (data.blanked) { overlay.classList.add('blank'); return; } else overlay.classList.remove('blank');
        overlay.classList.remove('hidden');
        verseText.innerHTML = safeSupText(sl.text); const rt = typeof sl.reference === 'string' ? sl.reference.trim() : ''; ltRefText.textContent = rt; reference.style.display = rt ? 'block' : 'none';
        try { applyTheme(data.theme || {}); } catch (error) { console.error('mce-bible-overlay lower-third theme error', error); }
        const anim = data.theme?.animation || 'slide-up'; lastAnimation = anim;

      /* ═══ EVENT-DRIVEN UPDATE PIPELINE ═══ */
      function readFromCssVar() { try { const raw = getComputedStyle(root).getPropertyValue('--overlay-data').trim(); if (!raw || raw === lastCssOverlayData) return false; lastCssOverlayData = raw; const n = raw.replace(/^['"]|['"]$/g, ''); if (!n) return false; processOverlayUpdate(JSON.parse(decodeURIComponent(n))); return true; } catch { } return false; }

      const _tabParam = new URLSearchParams(window.location.search).get('tab') || 'bible';
      const _storageKey = _tabParam === 'worship' ? 'worship-overlay-data' : 'bible-overlay-data';
      const _channelName = _tabParam === 'worship' ? 'obs-church-studio-worship-overlay' : 'obs-church-studio-bible-overlay';

      readFromUrlHash();
      readFromUrlSearch();
      readFromLocalStorage();
      readModeFromCssVar();

        if (!readFromCssVar() && attempts > 0) {

      /* ═══ POLLING — detect CSS variable updates from OBS SetInputSettings ═══

    })();
