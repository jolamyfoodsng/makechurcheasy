name: Deploy — Test MCE (develop)

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  NODE_VERSION: "24"
  VITE_APP_ENV: development

concurrency:
  group: deploy-develop
  cancel-in-progress: true

jobs:
  build-desktop:
    name: Build Desktop (development)
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          VITE_APP_ENV: development
          VITE_AUTH_API_URL: ${{ secrets.VITE_AUTH_API_URL || secrets.DEV_AUTH_API_URL || 'https://api.creatorstudioslabs.stream' }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || secrets.DEV_API_BASE_URL || 'https://api.creatorstudioslabs.stream' }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL || secrets.DEV_WS_URL || 'wss://relay.makechurcheasy.com' }}
