name: Copy public release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to copy, such as v4.3.10
        required: true
        type: string

permissions:
  contents: read

jobs:
  copy-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tools
        uses: actions/checkout@v4

      - name: Download source release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          DOWNLOAD_DIR: ${{ runner.temp }}/mce-release
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          mkdir -p "$DOWNLOAD_DIR"
          gh release download "$TAG" --repo "$SOURCE_REPO" --dir "$DOWNLOAD_DIR"
          gh release view "$TAG" --repo "$SOURCE_REPO" --json body --jq '.body' > "$NOTES_FILE"
          gh api "repos/$SOURCE_REPO/releases/tags/$TAG" > "$RUNNER_TEMP/source-release.json"

      - name: Normalize manifests for both public repositories
        env:
          TAG: ${{ inputs.tag }}
          MAIN_REPO: jolamyfoodsng/makechurcheasy
          MIRROR_REPO: jolamyfoodsng/makechurcheasy-releases
          DOWNLOAD_DIR: ${{ runner.temp }}/mce-release
          MIRROR_DIR: ${{ runner.temp }}/mce-release-mirror
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          mkdir -p "$MIRROR_DIR"
          node desktop/scripts/normalize-update-json.cjs "$DOWNLOAD_DIR/latest.json" \
            --out "$RUNNER_TEMP/latest-main.json" \
            --source-repo "$GITHUB_REPOSITORY" \
            --target-repo "$MAIN_REPO" \
            --tag "$TAG" \
            --notes-file "$NOTES_FILE"
          mv "$RUNNER_TEMP/latest-main.json" "$DOWNLOAD_DIR/latest.json"
          cp "$DOWNLOAD_DIR"/* "$MIRROR_DIR"/
          node desktop/scripts/normalize-update-json.cjs "$DOWNLOAD_DIR/latest.json" \
            --out "$MIRROR_DIR/latest.json" \
            --source-repo "$MAIN_REPO" \
            --target-repo "$MIRROR_REPO" \
            --tag "$TAG" \
            --notes-file "$NOTES_FILE"

      - name: Upload assets to MakeChurchEazy
        env:
          GH_TOKEN: ${{ secrets.UPDATER_GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          REPO: jolamyfoodsng/makechurcheasy
          ASSET_DIR: ${{ runner.temp }}/mce-release
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" \
              --title "MakeChurchEazy $TAG" \
              --notes-file "$NOTES_FILE" \
              --target master \
              --latest
          fi
          gh release upload "$TAG" "$ASSET_DIR"/* --repo "$REPO" --clobber

      - name: Upload assets to MakeChurchEazy releases mirror
        env:
          GH_TOKEN: ${{ secrets.UPDATER_GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          REPO: jolamyfoodsng/makechurcheasy-releases
          ASSET_DIR: ${{ runner.temp }}/mce-release-mirror
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" \
              --title "MakeChurchEazy $TAG" \
              --notes-file "$NOTES_FILE" \
              --target main \
              --latest
          fi
          gh release upload "$TAG" "$ASSET_DIR"/* --repo "$REPO" --clobber

      - name: Verify mirrored assets and manifest URLs
        env:
          GH_TOKEN: ${{ secrets.UPDATER_GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          MAIN_REPO: jolamyfoodsng/makechurcheasy
          MIRROR_REPO: jolamyfoodsng/makechurcheasy-releases
        run: |
          gh api "repos/$MAIN_REPO/releases/tags/$TAG" > "$RUNNER_TEMP/main-release.json"
          gh api "repos/$MIRROR_REPO/releases/tags/$TAG" > "$RUNNER_TEMP/mirror-release.json"
          python3 - "$RUNNER_TEMP/source-release.json" "$RUNNER_TEMP/main-release.json" "$RUNNER_TEMP/mirror-release.json" <<'PY'
          import json
          import pathlib
          import sys

          source, main, mirror = (json.loads(pathlib.Path(path).read_text()) for path in sys.argv[1:])
          expected = {asset['name']: asset['size'] for asset in source['assets']}
          for label, release in [('main', main), ('mirror', mirror)]:
              actual = {asset['name']: asset['size'] for asset in release['assets']}
              if actual.keys() != expected.keys():
                  raise SystemExit(f'{label}: asset names do not match the source release')
              for name, size in expected.items():
                  if name != 'latest.json' and actual[name] != size:
                      raise SystemExit(f'{label}: size mismatch for {name}')
          print(f"Verified {len(expected)} assets in both public releases.")
          PY

          mkdir -p "$RUNNER_TEMP/check-main" "$RUNNER_TEMP/check-mirror"
          gh release download "$TAG" --repo "$MAIN_REPO" --pattern latest.json --dir "$RUNNER_TEMP/check-main"
          gh release download "$TAG" --repo "$MIRROR_REPO" --pattern latest.json --dir "$RUNNER_TEMP/check-mirror"
          jq -e --arg version "${TAG#v}" --arg prefix "https://github.com/$MAIN_REPO/releases/download/$TAG/" \
            '.version == $version and all(.platforms[]; .url | startswith($prefix))' \
            "$RUNNER_TEMP/check-main/latest.json" >/dev/null
          jq -e --arg version "${TAG#v}" --arg prefix "https://github.com/$MIRROR_REPO/releases/download/$TAG/" \
            '.version == $version and all(.platforms[]; .url | startswith($prefix))' \
            "$RUNNER_TEMP/check-mirror/latest.json" >/dev/null
          echo "Both updater manifests point to their matching public release assets."
