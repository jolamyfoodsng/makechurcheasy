name: Deploy — Production (main)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "24"

concurrency:
  group: deploy-main

jobs:
  build-desktop:
    name: Build Desktop (production)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          VITE_APP_ENV: production
          VITE_AUTH_API_URL: ${{ secrets.PROD_AUTH_API_URL }}
          VITE_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
          VITE_WS_URL: ${{ secrets.PROD_WS_URL }}
