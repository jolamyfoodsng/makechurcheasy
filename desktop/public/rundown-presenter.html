<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MakeChurchEazy Presenter</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070d;
      color: #f8fafc;
      font-family: Inter, "SF Pro Display", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      user-select: none;
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 2.2vh 3vw;
      gap: 1.5vh;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #94a3b8;
      font-size: clamp(14px, 2.2vh, 28px);
      font-weight: 600;
      gap: 2vw;
    }

    .top .left { display: flex; flex-direction: column; gap: 0.3vh; min-width: 0; }
    .rundown-name { color: #e2e8f0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .top .right { display: flex; align-items: center; gap: 1.2vw; flex-shrink: 0; }
    .clock { font-variant-numeric: tabular-nums; color: #cbd5e1; }

    .conn { width: 1.2vh; height: 1.2vh; min-width: 8px; min-height: 8px; border-radius: 50%; background: #22c55e; }
    .conn.off { background: #ef4444; }

    #fs {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #e2e8f0;
      border-radius: 8px;
      padding: 0.6vh 1vw;
      font-size: clamp(12px, 1.8vh, 22px);
      cursor: pointer;
    }

    .main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 1.6vh;
    }

    .timer-name { font-size: clamp(20px, 5vh, 70px); font-weight: 700; color: #e2e8f0; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .speaker { font-size: clamp(16px, 3.2vh, 44px); color: #94a3b8; font-weight: 500; min-height: 1.2em; }

    .time {
      font-size: min(34vh, 24vw);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
      color: #22c55e;
      transition: color 0.2s linear;
    }

    .time.yellow { color: #eab308; }
    .time.red { color: #ef4444; }
    .time.neutral { color: #f8fafc; }
    .time.paused { opacity: 0.55; }

    .bar { width: 76vw; height: 3vh; min-height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); overflow: hidden; display: none; }
    .bar.on { display: block; }
    .bar .fill { height: 100%; width: 0; border-radius: 999px; background: #22c55e; transition: width 0.3s linear, background-color 0.3s linear; }

    .message {
      max-width: 92vw;
      font-size: clamp(22px, 7vh, 110px);
      line-height: 1.15;
      padding: 1vh 2vw;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.06);
      display: none;
      overflow-wrap: anywhere;
    }

    .message.on { display: block; }
    .message.flash { animation: flash 0.9s steps(1, end) infinite; }
    @keyframes flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.12; } }

    .next {
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 1vw;
      font-size: clamp(14px, 3vh, 40px);
      color: #94a3b8;
      min-height: 1.4em;
    }

    .next b { color: #e2e8f0; font-weight: 700; }

    .waiting { font-size: clamp(20px, 4vh, 56px); color: #94a3b8; }

    @media (prefers-reduced-motion: reduce) { .message.flash { animation: none; } }
  </style>
</head>

<body>
  <div id="app">
    <div class="top">
      <div class="left">
        <div class="rundown-name" id="rd-name">Presenter</div>
        <div id="rd-pos"></div>
      </div>
      <div class="right">
        <span class="clock" id="clock"></span>
        <span class="conn off" id="conn" title="Connection"></span>
        <button id="fs" type="button">Fullscreen</button>
      </div>
    </div>

    <div class="main" id="main">
      <div class="waiting" id="waiting">Waiting for the rundown to start&hellip;</div>
      <div class="timer-name" id="t-name" style="display:none"></div>
      <div class="speaker" id="t-speaker" style="display:none"></div>
      <div class="time neutral" id="time" style="display:none">00:00</div>
      <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
      <div class="message" id="msg"></div>
    </div>

    <div class="next" id="next"></div>
  </div>

  <script>
    (function () {
      var MSG_COLORS = { white: "#ffffff", green: "#4ade80", yellow: "#facc15", red: "#f87171" };
      var POLL_MS = 400;

      var els = {
        name: document.getElementById("rd-name"),
        pos: document.getElementById("rd-pos"),
        clock: document.getElementById("clock"),
        conn: document.getElementById("conn"),
        waiting: document.getElementById("waiting"),
        tName: document.getElementById("t-name"),
        tSpeaker: document.getElementById("t-speaker"),
        time: document.getElementById("time"),
        bar: document.getElementById("bar"),
        fill: document.getElementById("fill"),
        msg: document.getElementById("msg"),
        next: document.getElementById("next"),
        fs: document.getElementById("fs")
      };

      var state = null;      // last state from the Dock
      var seenAt = null;     // state.at value we last saw
      var receivedLocal = 0; // local time when we first saw that snapshot

      function pad(n) { return String(n).padStart(2, "0"); }

      function fmt(v, ceil) {
        var n = ceil ? Math.ceil(v) : Math.floor(v);
        var sign = n < 0 ? "-" : "";
        var a = Math.abs(n);
        var h = Math.floor(a / 3600), m = Math.floor((a % 3600) / 60), s = a % 60;
        return h > 0 ? sign + h + ":" + pad(m) + ":" + pad(s) : sign + pad(m) + ":" + pad(s);
      }

      function clockNow() {
        var d = new Date(), h = d.getHours(), h12 = h % 12 === 0 ? 12 : h % 12;
        return h12 + ":" + pad(d.getMinutes()) + " " + (h < 12 ? "AM" : "PM");
      }

      function fmtClockFull() {
        var d = new Date(), h = d.getHours(), h12 = h % 12 === 0 ? 12 : h % 12;
        return h12 + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds()) + " " + (h < 12 ? "AM" : "PM");
      }

      function render() {
        els.clock.textContent = clockNow();
        var st = state;
        var t = st && st.timer;
        if (!t) {
          els.waiting.style.display = "";
          els.tName.style.display = "none";
          els.tSpeaker.style.display = "none";
          els.time.style.display = "none";
          els.bar.classList.remove("on");
          els.msg.classList.remove("on", "flash");
          els.next.textContent = "";
          els.pos.textContent = "";
          return;
        }

        els.waiting.style.display = "none";
        els.name.textContent = st.rundownName || "Presenter";
        els.pos.textContent = "Timer " + (st.index + 1) + " of " + st.total + (st.status === "paused" ? " · Paused" : st.status === "idle" ? " · Ready" : "");

        els.tName.style.display = "";
        els.tName.textContent = t.name || "Timer";
        els.tSpeaker.style.display = "";
        els.tSpeaker.textContent = t.speaker || "";
        els.time.style.display = "";

        var level = "green", text, fraction = 0;
        if (t.kind === "timeofday") {
          text = fmtClockFull();
        } else {
          var dt = st.status === "running" ? Math.max(0, (Date.now() - receivedLocal) / 1000) : 0;
          var value = t.kind === "countdown" ? st.value - dt : st.value + dt;
          text = fmt(value, t.kind === "countdown");
          var left = t.kind === "countdown" ? value : (t.durationSeconds > 0 ? t.durationSeconds - value : null);
          if (left !== null) {
            if (t.warnRedSeconds > 0 && left <= t.warnRedSeconds) level = "red";
            else if (t.warnYellowSeconds > 0 && left <= t.warnYellowSeconds) level = "yellow";
            else if (left <= 0) level = "red";
          }
          if (t.durationSeconds > 0) {
            var elapsed = t.kind === "countdown" ? t.durationSeconds - value : value;
            fraction = Math.min(1, Math.max(0, elapsed / t.durationSeconds));
          }
        }

        els.time.textContent = text;
        els.time.className = "time " + (t.kind === "timeofday" ? "neutral" : level) + (st.status === "paused" ? " paused" : "");

        var showBar = !!st.showProgressBar && t.kind !== "timeofday" && t.durationSeconds > 0;
        els.bar.classList.toggle("on", showBar);
        els.fill.style.width = (fraction * 100).toFixed(2) + "%";
        els.fill.style.backgroundColor = { green: "#22c55e", yellow: "#eab308", red: "#ef4444" }[level];

        var m = st.message;
        if (m && m.text && String(m.text).trim()) {
          els.msg.textContent = m.text;
          els.msg.style.color = MSG_COLORS[m.color] || "#fff";
          els.msg.style.fontWeight = m.bold ? "800" : "500";
          els.msg.classList.add("on");
          els.msg.classList.toggle("flash", !!m.flash);
        } else {
          els.msg.classList.remove("on", "flash");
        }

        if (st.next) {
          var nd = st.next.kind === "countdown" ? " · " + fmt(st.next.durationSeconds, true) : "";
          els.next.innerHTML = "";
          var label = document.createElement("span");
          label.textContent = "Next:";
          var b = document.createElement("b");
          b.textContent = st.next.name || "Timer";
          var rest = document.createElement("span");
          rest.textContent = (st.next.speaker ? " — " + st.next.speaker : "") + nd;
          els.next.appendChild(label);
          els.next.appendChild(b);
          els.next.appendChild(rest);
        } else {
          els.next.textContent = "Last timer";
        }
      }

      function poll() {
        fetch("/api/rundown-state?_=" + Date.now(), { cache: "no-store" })
          .then(function (r) { return r.json(); })
          .then(function (data) {
            els.conn.classList.remove("off");
            if (!data || !data.timer) { state = data && data.rundownId ? data : null; render(); return; }
            if (seenAt !== data.at || !state || state.index !== data.index || state.rundownId !== data.rundownId) {
              seenAt = data.at;
              receivedLocal = Date.now();
            }
            state = data;
            render();
          })
          .catch(function () { els.conn.classList.add("off"); });
      }

      els.fs.addEventListener("click", function () {
        var d = document.documentElement;
        if (document.fullscreenElement) document.exitFullscreen();
        else if (d.requestFullscreen) d.requestFullscreen().catch(function () {});
      });
      document.addEventListener("fullscreenchange", function () {
        els.fs.style.display = document.fullscreenElement ? "none" : "";
      });

      setInterval(poll, POLL_MS);
      setInterval(render, 200);
      poll();
      render();
    })();
  </script>
</body>

</html>
