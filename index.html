<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LEGO Layout</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 1. HEADER SECTION (Top Bar) -->
    <header class="lego-header">
      Header Block (Logo &amp; Menu)
    </header>

    <!-- 2. HERO SECTION (Big Welcome Box) -->
    <section class="lego-hero">
      Hero / Banner Block (Big &amp; Bold)
    </section>

    <!-- 3. MAIN SECTION (With Side-by-Side Content) -->
    <main class="lego-container">
      <div class="lego-box red">Box A</div>
      <div class="lego-box yellow">Box B</div>
      <div class="lego-box green">Box C</div>
    </main>

    <!-- 4. FOOTER SECTION (Bottom Bar) -->
    <footer class="lego-footer">
      Footer Block (Copyright &amp; Links)
    </footer>
  </body>
</html>
