<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>Offline · MakeChurchEasy Admin</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #e2e8f0; background: radial-gradient(ellipse at 50% 0%, #1e3a5f 0, #0f172a 58%); }
      main { width: min(100%, 440px); padding: 32px; border: 1px solid #334155; border-radius: 24px; background: rgba(15, 23, 42, .88); box-shadow: 0 24px 80px rgba(0, 0, 0, .28); }
      .mark { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 15px; color: #bfdbfe; background: #1d4ed8; font-size: 22px; font-weight: 800; }
      h1 { margin: 24px 0 8px; font-size: clamp(24px, 7vw, 32px); letter-spacing: -.04em; }
      p { margin: 0; color: #94a3b8; line-height: 1.65; }
      button { width: 100%; min-height: 48px; margin-top: 24px; border: 0; border-radius: 12px; color: white; background: #2563eb; font: inherit; font-weight: 650; cursor: pointer; }
      button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">M</div>
      <h1>You’re offline</h1>
      <p>The admin dashboard needs an internet connection to load current information securely. Reconnect and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
