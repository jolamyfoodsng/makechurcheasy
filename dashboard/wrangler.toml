name = "mce-dashboard-cloudflare-staging"
main = ".open-next/worker.js"
compatibility_date = "2026-09-25"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true

[vars]
APP_ENV = "staging"
NODE_ENV = "production"
BACKEND_URL = "https://api.creatorstudioslabs.stream"
NEXT_PUBLIC_APP_ENV = "staging"
NEXT_PUBLIC_APP_URL = "https://mce-dashboard-cloudflare-staging.workers.dev"
NEXT_PUBLIC_API_URL = "https://api.creatorstudioslabs.stream"
