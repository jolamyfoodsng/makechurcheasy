name = "mce-dashboard-cloudflare-staging"
main = ".open-next/worker.js"
compatibility_date = "2026-09-25"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true

[vars]
APP_ENV = "production"
NODE_ENV = "production"
BACKEND_URL = "https://api.creatorstudioslabs.stream"
NEXT_PUBLIC_APP_ENV = "production"
NEXT_PUBLIC_APP_URL = "https://makechurcheazy.com"
NEXT_PUBLIC_API_URL = "https://api.creatorstudioslabs.stream"

[[routes]]
pattern = "makechurcheazy.com/*"
zone_name = "makechurcheazy.com"

[[routes]]
pattern = "www.makechurcheazy.com/*"
zone_name = "makechurcheazy.com"
