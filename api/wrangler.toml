name = "mce-api-cloudflare-staging"
main = "cloudflare-container-worker.ts"
compatibility_date = "2026-06-10"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

[observability]
enabled = true

[triggers]
crons = [
  "0 2 * * *",
  "0 22 * * *",
  "0 3 * * *",
  "*/15 * * * *",
  "15 3 * * *",
  "15 4 * * *",
  "30 3 * * *",
  "45 3 * * *",
]

[vars]
APP_ENV = "production"
NODE_ENV = "production"
NEXT_PUBLIC_APP_ENV = "production"
NEXT_PUBLIC_APP_URL = "https://makechurcheazy.com"
NEXT_PUBLIC_API_URL = "https://api.makechurcheazy.com"
ZOHO_CAMPAIGNS_SIGNUP_FORM_DISABLED = "true"

[[containers]]
class_name = "MceApiContainer"
image = "./Dockerfile"
instance_type = "basic"
max_instances = 1

[[durable_objects.bindings]]
name = "MCE_API_CONTAINER"
class_name = "MceApiContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MceApiContainer"]

[[routes]]
pattern = "api.makechurcheazy.com/*"
zone_name = "makechurcheazy.com"

[[routes]]
pattern = "makechurcheazy.com/api/*"
zone_name = "makechurcheazy.com"

[[routes]]
pattern = "api.creatorstudioslabs.stream/*"
zone_name = "creatorstudioslabs.stream"

[[routes]]
pattern = "api.creatorstudioslabs.stream"
custom_domain = true
enabled = true
previews_enabled = true
