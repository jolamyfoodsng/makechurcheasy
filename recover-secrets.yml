name: Recover Secrets

on:
  workflow_dispatch:

jobs:
  recover-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Export Secrets to Files
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          PROD_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
          PROD_AUTH_API_URL: ${{ secrets.PROD_AUTH_API_URL }}
          PROD_WS_URL: ${{ secrets.PROD_WS_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          VITE_ANALYTICS_ENDPOINT: ${{ secrets.VITE_ANALYTICS_ENDPOINT }}
          VITE_ANALYTICS_TOKEN: ${{ secrets.VITE_ANALYTICS_TOKEN }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_ASSEMBLYAI_API_KEYS: ${{ secrets.VITE_ASSEMBLYAI_API_KEYS }}
          VITE_AUTH_API_URL: ${{ secrets.VITE_AUTH_API_URL }}
          VITE_DEEPGRAM_API_KEYS: ${{ secrets.VITE_DEEPGRAM_API_KEYS }}
          VITE_SUBSCRIPTION_PUBLIC_KEY: ${{ secrets.VITE_SUBSCRIPTION_PUBLIC_KEY }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
        run: |
          mkdir -p recovered-secrets
          node -e '
            const fs = require("fs");
            const env = process.env;
            
            const secrets = [
              "APPLE_CERTIFICATE",
              "APPLE_CERTIFICATE_PASSWORD",
              "APPLE_ID",
              "APPLE_KEYCHAIN_PASSWORD",
              "APPLE_PASSWORD",
              "APPLE_TEAM_ID",
              "OPENCODE_API_KEY",
              "PROD_API_BASE_URL",
              "PROD_AUTH_API_URL",
              "PROD_WS_URL",
              "TAURI_SIGNING_PRIVATE_KEY",
              "TAURI_SIGNING_PRIVATE_KEY_PASSWORD",
              "TAURI_SIGNING_PUBLIC_KEY",
              "VITE_ANALYTICS_ENDPOINT",
              "VITE_ANALYTICS_TOKEN",
              "VITE_API_BASE_URL",
              "VITE_ASSEMBLYAI_API_KEYS",
              "VITE_AUTH_API_URL",
              "VITE_DEEPGRAM_API_KEYS",
              "VITE_SUBSCRIPTION_PUBLIC_KEY",
              "VITE_WS_URL"
            ];

            let envContent = "";
            for (const key of secrets) {
              const val = env[key] || "";
              const escaped = val.includes("\n") ? JSON.stringify(val) : `"${val.replace(/"/g, "\\\"")}"`;
              envContent += `${key}=${escaped}\n`;
              fs.writeFileSync(`recovered-secrets/${key}.txt`, val, "utf8");
            }

            fs.writeFileSync("recovered-secrets/.env.secrets", envContent, "utf8");

            if (env.TAURI_SIGNING_PRIVATE_KEY) {
              fs.writeFileSync("recovered-secrets/tauri.key", env.TAURI_SIGNING_PRIVATE_KEY, "utf8");
            }
            if (env.TAURI_SIGNING_PUBLIC_KEY) {
              fs.writeFileSync("recovered-secrets/tauri.key.pub", env.TAURI_SIGNING_PUBLIC_KEY, "utf8");
            }
            if (env.APPLE_CERTIFICATE) {
              try {
                const buf = Buffer.from(env.APPLE_CERTIFICATE.trim(), "base64");
                fs.writeFileSync("recovered-secrets/apple_certificate.p12", buf);
              } catch (_) {}
            }
          '

      - name: Upload All Recovered Secrets
        uses: actions/upload-artifact@v4
        with:
          name: all-github-secrets
          path: recovered-secrets/
          retention-days: 1
