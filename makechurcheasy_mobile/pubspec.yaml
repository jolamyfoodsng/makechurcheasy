name: makechurcheasy_mobile
description: "MakeChurchEasy Mobile Companion — control your church presentation from your phone."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^15.1.1
  flutter_riverpod: ^2.6.1
  web_socket_channel: ^3.0.3
  mobile_scanner: ^7.0.1
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  qr_flutter: ^4.1.0
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
