<!doctype html>
<!--
  Make Church Easy — Broadcast Graphic (format "mce-graphic@1")
  Youth Revival Banner: a wide event banner (big extended title, subtitle, website pill
  with a trailing line, venue line, sparkles and a wireframe globe) on a dark panel with
  two drifting colour glows. Designed in 1920x1080 pixels.

  Upload in Admin → Broadcast Graphics → Upload graphic.
  Fonts are embedded (Archivo, Montserrat — SIL Open Font License 1.1) so it works offline.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Youth Revival Banner</title>

  <script type="application/json" id="mce-graphic">
{
  "format": "mce-graphic@1",
  "id": "youth-revival-banner",
  "version": 2,
  "name": "Youth Revival Banner",
  "category": "announcements",
  "description": "Wide event banner: the panel wipes in, an extended title stretches into place, the website pill grows out with a trailing line, sparkles spin in and twinkle. Background: glow, gradient, solid colour or your own picture",
  "color": "#10b981",
  "hold": 10,
  "placement": {
    "x": 110,
    "y": 64,
    "scale": 1
  },
  "fields": [
    {
      "key": "title",
      "label": "Title",
      "type": "text",
      "default": "YOUTH REVIVAL"
    },
    {
      "key": "subtitle",
      "label": "Subtitle",
      "type": "text",
      "default": "Three Nights of Fire & Worship"
    },
    {
      "key": "website",
      "label": "Website",
      "type": "text",
      "default": "www.gracecityyouth.org"
    },
    {
      "key": "venue",
      "label": "Venue line",
      "type": "text",
      "default": "45 KINGDOM AVENUE."
    },
    {
      "key": "bgstyle",
      "label": "Background",
      "type": "select",
      "default": "glow",
      "options": [
        {
          "value": "glow",
          "label": "Glow (two colours)"
        },
        {
          "value": "gradient",
          "label": "Gradient"
        },
        {
          "value": "solid",
          "label": "Solid colour"
        },
        {
          "value": "image",
          "label": "Picture"
        }
      ]
    },
    {
      "key": "bgimage",
      "label": "Background picture (when Background = Picture)",
      "type": "image",
      "default": ""
    },
    {
      "key": "bg",
      "label": "Panel colour",
      "type": "color",
      "default": "#06151a"
    },
    {
      "key": "a",
      "label": "Glow / gradient colour 1",
      "type": "color",
      "default": "#10b981"
    },
    {
      "key": "b",
      "label": "Glow / gradient colour 2",
      "type": "color",
      "default": "#f59e0b"
    },
    {
      "key": "t",
      "label": "Text colour",
      "type": "color",
      "default": "#ffffff"
    },
    {
      "key": "c",
      "label": "Pill, line & sparkle colour",
      "type": "color",
      "default": "#ffffff"
    },
    {
      "key": "globe",
      "label": "Globe",
      "type": "select",
      "default": "show",
      "options": [
        {
          "value": "show",
          "label": "Show"
        },
        {
          "value": "hide",
          "label": "Hide"
        }
      ]
    },
    {
      "key": "sparkles",
      "label": "Sparkles",
      "type": "select",
      "default": "show",
      "options": [
        {
          "value": "show",
          "label": "Show"
        },
        {
          "value": "hide",
          "label": "Hide"
        }
      ]
    }
  ],
  "animation": {
    "in": [
      [
        ".yr-panel",
        "wipeL",
        0,
        {
          "d": 0.75
        }
      ],
      [
        ".yr-photo",
        "fade",
        0.15,
        {
          "d": 0.9
        }
      ],
      [
        ".yr-glow",
        "fade",
        0.25,
        {
          "d": 1.1,
          "s": 0.12
        }
      ],
      [
        ".yr-title",
        "stretch",
        0.35,
        {
          "d": 0.65
        }
      ],
      [
        ".yr-sub",
        "maskUp",
        0.72,
        {
          "d": 0.5
        }
      ],
      [
        ".yr-globe circle, .yr-globe ellipse, .yr-globe line",
        "draw",
        0.55,
        {
          "d": 1.1,
          "s": 0.07
        }
      ],
      [
        ".yr-pill",
        "growX",
        0.8,
        {
          "d": 0.55
        }
      ],
      [
        ".yr-url",
        "fade",
        1.1,
        {
          "d": 0.4
        }
      ],
      [
        ".yr-line",
        "growX",
        1.05,
        {
          "d": 0.55
        }
      ],
      [
        ".yr-addr",
        "skew",
        1.15,
        {
          "d": 0.5
        }
      ],
      [
        ".yr-spark",
        "spin",
        0.95,
        {
          "s": 0.14
        }
      ]
    ],
    "out": [
      {
        "sel": ".yr-spark",
        "to": {
          "scale": 0,
          "rotation": 140,
          "opacity": 0,
          "transformOrigin": "50% 50%"
        },
        "at": 0,
        "d": 0.35,
        "e": "power2.in",
        "s": 0.05
      },
      {
        "sel": ".yr-addr",
        "to": {
          "x": 70,
          "skewX": -20,
          "opacity": 0
        },
        "at": 0.05,
        "d": 0.35,
        "e": "power2.in"
      },
      {
        "sel": ".yr-url",
        "to": {
          "opacity": 0
        },
        "at": 0.05,
        "d": 0.2
      },
      {
        "sel": ".yr-line",
        "to": {
          "scaleX": 0,
          "transformOrigin": "100% 50%"
        },
        "at": 0.1,
        "d": 0.35,
        "e": "power3.in"
      },
      {
        "sel": ".yr-pill",
        "to": {
          "scaleX": 0,
          "opacity": 0,
          "transformOrigin": "100% 50%"
        },
        "at": 0.25,
        "d": 0.3,
        "e": "power3.in"
      },
      {
        "sel": ".yr-sub",
        "to": {
          "yPercent": 110,
          "opacity": 0
        },
        "at": 0.1,
        "d": 0.3,
        "e": "power2.in"
      },
      {
        "sel": ".yr-title",
        "to": {
          "scaleX": 1.6,
          "opacity": 0,
          "filter": "blur(8px)",
          "transformOrigin": "100% 50%"
        },
        "at": 0.2,
        "d": 0.4,
        "e": "power3.in"
      },
      {
        "sel": ".yr-globe",
        "to": {
          "opacity": 0,
          "y": 30
        },
        "at": 0.1,
        "d": 0.35,
        "e": "power2.in"
      },
      {
        "sel": ".yr-panel",
        "to": {
          "clipPath": "inset(0% 0% 0% 100%)"
        },
        "at": 0.5,
        "d": 0.55,
        "e": "power3.inOut"
      }
    ],
    "ambient": [
      {
        "sel": ".yr-spark",
        "to": {
          "scale": 0.55,
          "opacity": 0.5,
          "rotation": 45,
          "transformOrigin": "50% 50%"
        },
        "d": 1.1,
        "yoyo": true,
        "s": 0.4
      },
      {
        "sel": ".yr-glow1",
        "to": {
          "x": 160,
          "y": 20
        },
        "d": 6,
        "yoyo": true
      },
      {
        "sel": ".yr-glow2",
        "to": {
          "x": -180,
          "y": -18
        },
        "d": 7,
        "yoyo": true
      }
    ]
  }
}
  </script>

    .yr-panel{position:relative;overflow:hidden;width:1700px;height:224px;display:flex;align-items:center;background:var(--bg);box-shadow:0 14px 40px rgba(0,0,0,.45)}
    .yr-glow{position:absolute;border-radius:50%;pointer-events:none}
    .yr-glow1{left:-140px;top:-190px;width:760px;height:340px;background:var(--a);filter:blur(90px);opacity:.62}
    .yr-glow2{right:120px;bottom:-210px;width:640px;height:320px;background:var(--b);filter:blur(95px);opacity:.58}
    .yr-glow3{right:-160px;top:-60px;width:340px;height:340px;background:var(--a);filter:blur(110px);opacity:.30}
    .yr-photo{position:absolute;inset:0;display:none}
    .yr-photo .pkg-img{width:100%;height:100%;max-width:none;max-height:none;object-fit:cover}
    .yr-shade{position:absolute;inset:0;display:none;background:linear-gradient(90deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.45) 55%,rgba(0,0,0,.62) 100%)}
    .yr-bg-image .yr-photo,.yr-bg-image .yr-shade{display:block}
    .yr-bg-image .yr-glow,.yr-bg-solid .yr-glow,.yr-bg-gradient .yr-glow{display:none}
    .yr-bg-gradient{background:linear-gradient(100deg,var(--a) 0%,var(--bg) 48%,var(--b) 100%)}
    .yr-globe-hide .yr-globe,.yr-spark-hide .yr-spark{display:none}
    .yr-left{position:relative;flex:0 0 1010px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:4px}
    .yr-title{font:900 extra-expanded 86px/0.92 'YR Archivo',sans-serif;letter-spacing:-0.01em;color:var(--t);text-transform:uppercase;white-space:nowrap;text-shadow:0 4px 18px rgba(0,0,0,.25)}
    .yr-sub{margin-top:16px;font:600 40px/1.1 'YR Montserrat',sans-serif;color:var(--t);white-space:nowrap}
    .yr-right{position:relative;flex:1 1 auto;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:24px;padding-left:24px;align-self:stretch}
    .yr-pillrow{display:flex;align-items:center;width:100%}
    .yr-pill{flex:0 0 auto;border:3px solid var(--c);border-radius:999px;padding:11px 40px;font:600 27px/1 'YR Montserrat',sans-serif;color:var(--t);white-space:nowrap}
    .yr-url{display:inline-block}
    .yr-line{flex:1 1 auto;height:3px;background:var(--c)}
    .yr-addr{padding-left:4px;font:italic 800 46px/1 'YR Montserrat',sans-serif;color:var(--t);white-space:nowrap;letter-spacing:.005em}
    .yr-spark{position:absolute;fill:var(--c);filter:drop-shadow(0 0 8px rgba(255,255,255,.65))}
    .yr-s1{left:22px;top:12px;width:34px;height:34px}
    .yr-s2{left:930px;top:136px;width:50px;height:50px}
    .yr-s3{right:30px;top:14px;width:24px;height:24px}
    .yr-globe{position:absolute;left:44px;bottom:-46px;width:118px;height:118px;fill:none;stroke:var(--c);stroke-width:2.2;opacity:.85}
  </style>
</head>
<body>
  <template id="mce-graphic-html">
    <div class="yr-panel yr-bg-{{bgstyle}} yr-globe-{{globe}} yr-spark-{{sparkles}}">
      <div class="yr-photo">{{image:bgimage}}</div>
      <i class="yr-shade"></i>
      <i class="yr-glow yr-glow1"></i>
      <i class="yr-glow yr-glow2"></i>
      <i class="yr-glow yr-glow3"></i>
      <svg class="yr-globe" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="46"></circle>
        <ellipse cx="50" cy="50" rx="22" ry="46"></ellipse>
        <line x1="50" y1="4" x2="50" y2="96"></line>
        <line x1="6" y1="35" x2="94" y2="35"></line>
        <line x1="4" y1="50" x2="96" y2="50"></line>
        <line x1="6" y1="65" x2="94" y2="65"></line>
      </svg>
      <svg class="yr-spark yr-s1" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C12.7 7.6 16.4 11.3 24 12C16.4 12.7 12.7 16.4 12 24C11.3 16.4 7.6 12.7 0 12C7.6 11.3 11.3 7.6 12 0Z"></path></svg>
      <svg class="yr-spark yr-s2" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C12.7 7.6 16.4 11.3 24 12C16.4 12.7 12.7 16.4 12 24C11.3 16.4 7.6 12.7 0 12C7.6 11.3 11.3 7.6 12 0Z"></path></svg>
      <svg class="yr-spark yr-s3" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C12.7 7.6 16.4 11.3 24 12C16.4 12.7 12.7 16.4 12 24C11.3 16.4 7.6 12.7 0 12C7.6 11.3 11.3 7.6 12 0Z"></path></svg>
      <div class="yr-left">
        <div class="yr-title">{{title}}</div>
        <div class="yr-sub">{{subtitle}}</div>
      </div>
      <div class="yr-right">
        <div class="yr-pillrow">
          <div class="yr-pill"><span class="yr-url">{{website}}</span></div>
          <i class="yr-line"></i>
        </div>
        <div class="yr-addr">{{venue}}</div>
      </div>
    </div>
  </template>
